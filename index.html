<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Find the Groom</title>
<style>
  :root{
    --bg:#0a0a0c; --panel:#141419; --line:#26262e;
    --ink:#f4f4f6; --dim:#8c8c99;
    --red:#e01b24; --green:#1a9e3c; --amber:#c9a227;
    --alpha:#e8b73a; --bravo:#4da3ff; --charlie:#ff7ad9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh; overscroll-behavior:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{max-width:520px;margin:0 auto;padding:16px;min-height:100dvh;display:flex;flex-direction:column}

  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:14px;margin:0 0 20px}

  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .btn{
    display:block;width:100%;min-height:66px;padding:14px 16px;margin-bottom:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    text-align:left;transition:transform .06s;
  }
  .btn:active{transform:scale(.985)}
  .btn .name{font-size:19px;font-weight:600;letter-spacing:-.01em}
  .btn .addr{font-size:13px;color:var(--dim);margin-top:2px}
  .btn[disabled]{opacity:.55;pointer-events:none}
  .btn.big{min-height:78px;text-align:center;font-size:26px;font-weight:700;letter-spacing:.06em}

  .primary{background:var(--green);border-color:var(--green);font-weight:700}
  .danger{background:var(--red);border-color:var(--red);font-weight:700}
  .ghost{background:transparent}
  .row{display:flex;gap:10px}
  .row>*{flex:1}

  .counts{
    display:flex;gap:8px;margin-bottom:12px;font-size:13px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  }
  .counts div{flex:1;text-align:center}
  .counts b{display:block;font-size:20px;font-weight:700;margin-top:2px}
  .counts .me{color:var(--amber)}

  .hint{
    background:rgba(201,162,39,.12);border:1px solid var(--amber);color:#f0d98a;
    border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px;
  }
  .alert{border-color:var(--red)!important;background:rgba(224,27,36,.12)!important;color:#ffb3b8!important}
  .good{border-color:var(--green)!important;background:rgba(26,158,60,.12)!important;color:#8ee79f!important}

  /* visited bars: struck-through info + live banana-trap / photo badges */
  .usedrow{display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin-bottom:10px;
    min-height:66px}
  .usedrow .info{flex:1;opacity:.38}
  .usedrow .info.found{opacity:1}
  .usedrow .info .name{font-size:19px;font-weight:600;text-decoration:line-through}
  .usedrow .info.found .name{text-decoration:none;color:#8ee79f}
  .usedrow .info .addr{font-size:13px;color:var(--dim);margin-top:2px}
  .usedrow .trap{min-width:74px;min-height:46px;border:1px solid var(--amber);border-radius:10px;
    font-size:15px;font-weight:600;color:#f0d98a;background:rgba(201,162,39,.10)}
  .usedrow .placed{font-size:24px}

  /* full-screen result states */
  .full{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;
    align-items:center;justify-content:flex-start;text-align:center;padding:24px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));overflow-y:auto;
  }
  .full.wrong{background:var(--red)}
  .full.win{background:var(--green)}
  .full.over{background:var(--panel)}
  .full .inner{margin:auto;display:flex;flex-direction:column;align-items:center;padding:10px 0;width:100%}
  .huge{font-size:clamp(36px,11vw,56px);line-height:.95;font-weight:800;letter-spacing:-.03em;margin:0}
  .order{font-size:clamp(19px,5.5vw,26px);font-weight:800;line-height:1.12;margin:14px 0 0;text-wrap:balance}
  .whichbar{font-size:15px;opacity:.85;margin:12px 0 0}
  .timer{font-size:clamp(38px,11vw,60px);font-weight:800;font-variant-numeric:tabular-nums;
    margin:14px 0 2px;letter-spacing:-.03em}
  .timerlabel{font-size:13px;opacity:.8;text-transform:uppercase;letter-spacing:.12em}
  .banbanner{background:#fff;color:var(--red);font-weight:800;border-radius:12px;
    padding:10px 16px;margin-top:10px;font-size:17px}
  .proofbtn{background:#fff;color:var(--red);text-align:center;font-weight:800;min-height:54px;
    width:250px;margin:14px auto 0;border-radius:12px;font-size:16px}
  .proofok{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 14px;margin-top:14px;
    font-weight:700;display:flex;align-items:center;gap:10px}
  .proofok img{height:56px;border-radius:8px;display:block}

  .banner{
    position:fixed;left:0;right:0;top:0;z-index:60;background:var(--amber);color:#241d00;
    font-size:13px;font-weight:600;text-align:center;padding:7px 12px;
  }

  .sheet{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.72);display:flex;align-items:flex-end}
  .sheet-inner{width:100%;max-width:520px;margin:0 auto;background:var(--panel);
    border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line)}
  .sheet h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  .sheet p{color:var(--dim);margin:0 0 20px;font-size:14px}

  input,select{
    width:100%;padding:14px;background:#0e0e12;color:var(--ink);
    border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:10px;
  }
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--dim);margin:16px 0 6px}

  .feed{font-size:14px}
  .feed div{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
  .feed .t{width:52px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
  .feed .tm{width:66px;font-weight:700;flex:none}
  .feed .ok{color:var(--green);font-weight:700}
  .feed img{height:34px;border-radius:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;margin-bottom:8px}
  .warn{color:var(--amber);font-size:13px;margin:6px 0 0}
  .spacer{flex:1}
  .foot{color:var(--dim);font-size:12px;text-align:center;padding-top:18px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================ config === */
const SUPABASE_URL = "https://yfzbgvqthrgqardavayq.supabase.co";
const SUPABASE_KEY = "sb_publishable_vqCpRtzUzIAruuDcrNyIFw_hZHwZxG6";
const PHOTO_BASE   = SUPABASE_URL + "/storage/v1/object/public/stag-photos/";

const TEAMS = ["ALPHA", "BRAVO", "CHARLIE"];
const TEAM_COLOR = { ALPHA: "var(--alpha)", BRAVO: "var(--bravo)", CHARLIE: "var(--charlie)" };
const FIND_PTS = 5;

/* Presented in brief order. */
const BARS = [
  { n:"U Sadu",                  a:"Škroupovo nám. 5" },
  { n:"Áčko Žižkov",             a:"Bořivojova 98" },
  { n:"Bukowski's Bar",          a:"Bořivojova 86" },
  { n:"Woodoo",                  a:"Bořivojova 69" },
  { n:"Bar Bohužel",             a:"Bořivojova 61 · cash only" },
  { n:"Theatrino Cocktail Bar",  a:"Bořivojova 53" },
  { n:"Maverick's Irish pub",    a:"Žižkov 204" },
  { n:"SMÄD craft beer bar",     a:"Táboritská 10" },
  { n:"Pivoteka Žižkoff",        a:"Milíčova 6" },
  { n:"Pub a Bar Na Plech",      a:"Bořivojova 503" },
  { n:"Tiki Taky Bar",           a:"Seifertova 20" },
  { n:"Vlkova 26",               a:"Vlkova 26" },
];

const POLL_MS = 6000;
const RPC_TIMEOUT_MS = 12000;
const ARM_MS = 400;               // sheet buttons arm after this — stops tap-through

/* ============================================================= state === */
let team        = null;
let state       = null;
let clockSkew   = 0;              // serverNow - deviceNow, ms
let pending     = null;           // bar object awaiting guess confirmation
let bananaPending = null;         // bar name awaiting banana confirmation
let sheetArmedAt = 0;             // when the current sheet was opened
let sending     = false;
let uploading   = false;
let spinning    = false;
let failedGuess = null;
let notice      = null;           // one-off message (e.g. "didn't count")
let offline     = false;
let admin       = null;
let adminPass   = "";
let lastSig     = "";
let refreshId   = 0;              // ignore out-of-order poll responses
const spunMem   = new Set();      // in-memory mirror of the spun flags

const el = document.getElementById("app");
const serverNow = () => Date.now() + clockSkew;

function remember(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function isSpun(k){ return spunMem.has(k) || recall(k) === "1"; }
function markSpun(k){ spunMem.add(k); remember(k, "1"); }

const lastGuess = () => (state && state.my_guesses || []).slice(-1)[0] || null;
const iFound    = () => (state && state.my_guesses || []).some(g => g.correct);

/* =========================================================== network === */
async function rpc(fn, body){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), RPC_TIMEOUT_MS);
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(body || {}),
      signal: ctl.signal,
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  }finally{
    clearTimeout(t);
  }
}

async function refresh(){
  if(location.hash === "#admin") return adminRefresh();
  if(!team) return;
  const id = ++refreshId;                     // stale responses are discarded
  try{
    const data = await rpc("stag_state", { p_team: team });
    if(id !== refreshId) return;
    state = data; offline = false;
    if(data.server_now) clockSkew = new Date(data.server_now).getTime() - Date.now();
  }catch(e){
    if(id !== refreshId) return;
    offline = true;
  }
  if(spinning || uploading) return;           // never interrupt those
  const sig = JSON.stringify([state ? { ...state, server_now: 0 } : null, offline, team]);
  if(sig !== lastSig){ lastSig = sig; render(); }
}

async function adminRefresh(){
  if(!admin) return;
  const ae = document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  try{
    const r = await rpc("stag_admin", { p_pass: adminPass, p_action: "read" });
    if(r.ok){ admin = r; renderAdmin(); }
  }catch(e){ /* keep last good feed */ }
}

/* ========================================================== cooldown === */
function cooldownLeft(){
  if(!state || !state.last_guess_at) return 0;
  const ends = new Date(state.last_guess_at).getTime() + state.cooldown_seconds * 1000;
  return Math.max(0, ends - serverNow());
}
function mmss(ms){
  const s = Math.ceil(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2,"0") + ":" + String(s % 60).padStart(2,"0");
}
function buzz(pattern){ try{ navigator.vibrate && navigator.vibrate(pattern); }catch(e){} }

/* =========================================================== forfeit ==== */
/* Outcome is a pure hash of team+bar: every phone lands on the same result,
   and a refresh can't reroll it. Banana multiplier comes from the server. */
const DRINKS = [
  { label: ["PINTS"],              text: "PINTS OF LAGER" },
  { label: ["SHOTS"],              text: "SHOTS" },
  { label: ["MIXERS"],             text: "MIXERS" },
  { label: ["BARMAN'S", "CHOICE"], text: "BARMAN'S CHOICE" },
  { label: ["FREE", "PASS"],       text: "FREE PASS", free: true },
];
const SEG = 360 / DRINKS.length;
const COUNTS = [1,2,2,3,3,3,4,4,5,5];

function forfeitFor(team, bar){
  let x = 2166136261;                    // FNV-1a
  const s = team + "|" + bar;
  for(let i = 0; i < s.length; i++){ x = Math.imul(x ^ s.charCodeAt(i), 16777619) >>> 0; }
  const d      = x % DRINKS.length;
  const count  = COUNTS[Math.floor(x / 13) % COUNTS.length];
  const jitter = (Math.floor(x / 131) % 37) - 18;
  return { count, drink: DRINKS[d], free: !!DRINKS[d].free,
           rotation: 5 * 360 - d * SEG + jitter };
}
function forfeitText(f, mult){
  if(f.free) return "FREE PASS — NOBODY DRINKS";
  const n = f.count * (mult || 1);
  return (n === 5 ? "ALL 5" : n) + " × " + f.drink.text;
}

function wheelHTML(f, spun, mult){
  const r = 140;
  const segs = DRINKS.map((d, i) => {
    const a0 = (i * SEG - SEG/2 - 90) * Math.PI / 180, a1 = (i * SEG + SEG/2 - 90) * Math.PI / 180;
    const label = d.label.map((line, j) =>
      `<tspan x="0" dy="${j === 0 ? 0 : 14}">${line}</tspan>`).join("");
    return `<path d="M0 0 L${(Math.cos(a0)*r).toFixed(1)} ${(Math.sin(a0)*r).toFixed(1)}
                     A${r} ${r} 0 0 1 ${(Math.cos(a1)*r).toFixed(1)} ${(Math.sin(a1)*r).toFixed(1)} Z"
             fill="${d.free ? "rgba(255,255,255,.55)" : `rgba(255,255,255,${i % 2 ? ".30" : ".16"})`}"/>
            <text transform="rotate(${i * SEG}) translate(0 -${r * 0.60})" text-anchor="middle"
              font-size="13" font-weight="700"
              fill="${d.free ? "var(--red)" : "#fff"}">${label}</text>`;
  }).join("");
  return `
    <svg width="225" height="235" viewBox="-150 -158 300 316" style="display:block;margin:6px auto 0">
      <polygon points="-13,-156 13,-156 0,-132" fill="#fff"/>
      <g id="wheelg" style="${spun ? `transform:rotate(${f.rotation}deg)` : ""}">
        <circle r="${r}" fill="rgba(0,0,0,.25)"/>
        ${segs}
      </g>
      <circle r="36" fill="rgba(0,0,0,.45)"/>
      <text id="fcount" y="13" text-anchor="middle" font-size="38" font-weight="800"
            fill="#fff">${spun ? (f.free ? "0" : f.count * (mult || 1)) : "?"}</text>
    </svg>
    ${spun ? "" : `<button class="btn" id="spinbtn" style="background:#fff;color:var(--red);
       text-align:center;font-weight:800;min-height:56px;width:230px;margin:12px auto 0">SPIN</button>`}`;
}

function spinWheel(f, key, mult){
  if(spinning) return;
  spinning = true;
  const gEl = document.getElementById("wheelg");
  const btn = document.getElementById("spinbtn");
  if(btn) btn.style.visibility = "hidden";
  const cnt  = document.getElementById("fcount");
  const roll = setInterval(() => { if(cnt) cnt.textContent = 1 + Math.floor(Math.random() * 5); }, 90);
  gEl.style.transition = "transform 3.2s cubic-bezier(.12,.65,.08,1)";
  requestAnimationFrame(() => { gEl.style.transform = `rotate(${f.rotation}deg)`; });
  setTimeout(() => {
    clearInterval(roll);
    markSpun(key);
    spinning = false;
    buzz([80, 40, 80, 40, 200]);
    render();                              // full redraw shows result + proof button
  }, 3350);
}

/* ============================================================ actions === */
function applyLocalGuess(bar, r){
  // The guess landed but the follow-up state read didn't: synthesize just
  // enough state locally so the screen moves. Next good poll replaces it.
  if(!state) return;
  state.my_guesses = (state.my_guesses || []).concat([{
    bar, correct: r.result === "correct", at: r.server_now,
    mult: r.mult || 1, by: r.by || null, photo: null,
  }]);
  state.last_guess_at = r.server_now;
  if(r.cooldown_seconds != null) state.cooldown_seconds = r.cooldown_seconds;
}

async function submitGuess(bar){
  if(sending) return;
  sending = true; failedGuess = null; notice = null; render();   // sheet shows "Sending…"
  try{
    const r = await rpc("stag_guess", { p_team: team, p_bar: bar });
    pending = null;
    if(r.server_now) clockSkew = new Date(r.server_now).getTime() - Date.now();
    if(r.result === "correct")      buzz([120, 60, 120, 60, 400]);
    else if(r.result === "wrong")   buzz(500);
    else if(r.result === "locked")  notice = "That didn't count — your team was already on cooldown. " + bar + " is still available.";
    else if(r.result === "error")   notice = r.message || "Rejected.";
    await refresh();
    if(offline && (r.result === "wrong" || r.result === "correct")) applyLocalGuess(bar, r);
  }catch(e){
    failedGuess = bar;                      // timeout or dead network: offer retry
  }finally{
    pending = null; sending = false; render();
  }
}

async function dropBanana(bar){
  bananaPending = null; render();
  try{
    const r = await rpc("stag_banana", { p_team: team, p_bar: bar });
    if(r.result === "error") notice = r.message;
    await refresh(); render();
  }catch(e){
    notice = "Banana didn't send — try again."; render();
  }
}

async function uploadProof(bar, file){
  if(uploading || !file) return;
  uploading = true; render();
  try{
    const blob = await compressImage(file);
    const path = team + "-" + Date.now() + ".jpg";
    const res = await fetch(SUPABASE_URL + "/storage/v1/object/stag-photos/" + path, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY,
                 "Content-Type": "image/jpeg" },
      body: blob,
    });
    if(!res.ok) throw new Error("upload " + res.status);
    const r = await rpc("stag_photo", { p_team: team, p_bar: bar, p_path: path });
    if(r.result !== "ok") throw new Error(r.message || "rejected");
    uploading = false;
    await refresh(); render();
  }catch(e){
    uploading = false;
    notice = "Photo didn't upload — try again when you have signal.";
    render();
  }
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("encode failed")), "image/jpeg", 0.65);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("read failed")); };
    img.src = url;
  });
}

/* ============================================================== views === */
function h(html){ el.innerHTML = html; }

function render(){
  if(location.hash === "#admin") return renderAdmin();
  if(!team) return renderJoin();
  if(!state){ renderConnecting(); }
  else if(state.status !== "running"){ renderOver(); }
  else{
    const left = cooldownLeft();
    const last = lastGuess();
    if(left > 0 && last && last.correct) renderFound(left);
    else if(left > 0 && last)            renderCooldown(left, last);
    else                                 renderGuessList();
  }
  // Sheets are drawn BY render, so a re-render can never orphan them.
  if(pending)       attachGuessSheet();
  if(bananaPending) attachBananaSheet();
}

function renderConnecting(){
  h(`
    <h1>Find the Groom</h1>
    <p class="sub">Team ${team}</p>
    ${offline
      ? `<div class="hint alert">
           <b>Can't reach the server.</b> Walk towards the door or the street —
           cellar bars kill the signal. Retrying automatically.
         </div>
         <button class="btn primary" style="text-align:center" id="again">Retry now</button>`
      : `<p class="sub">Connecting…</p>`}
    <div class="spacer"></div>
    <button class="btn ghost" style="text-align:center" id="switch">Change team</button>
  `);
  const a = document.getElementById("again");
  if(a) a.onclick = refresh;
  document.getElementById("switch").onclick = () => {
    team = null; remember("stag_team", ""); render();
  };
}

function renderJoin(){
  h(`
    <h1>Find the Groom</h1>
    <p class="sub">Žižkov · Friday night. Pick your team.</p>
    ${TEAMS.map(t => `<button class="btn big" data-team="${t}">${t}</button>`).join("")}
    <div class="spacer"></div>
    <p class="foot">One bar has a table reserved. Finding it = ${FIND_PTS} pts.
      Every other bar you drink at = 1 pt (2 if banana'd). Most points wins.</p>
  `);
  el.querySelectorAll("[data-team]").forEach(b => b.onclick = () => {
    team = b.dataset.team; remember("stag_team", team);
    render(); refresh();
  });
}

function scoreStrip(){
  const sc = (state && state.scores) || {};
  const fd = (state && state.found)  || {};
  return `<div class="counts">${TEAMS.map(t =>
    `<div class="${t === team ? "me" : ""}">${t}${fd[t] ? " ✓" : ""}<b>${sc[t] || 0}</b></div>`
  ).join("")}</div>`;
}

function renderGuessList(){
  const gs      = state.my_guesses || [];
  const mine    = gs.map(g => g.bar);
  const rivals  = state.rival_bars || [];
  const myBan   = state.my_bananas || [];
  const banLeft = state.bananas_left != null ? state.bananas_left : 3;
  const found   = iFound();
  const banner  = offline ? `<div class="banner">No signal — showing last known state</div>` : "";
  const note    = notice ? `<div class="hint">${esc(notice)}</div>` : "";
  const hint    = state.hint ? `<div class="hint"><b>Hint.</b> ${esc(state.hint)}</div>` : "";
  const foundBox = found ? `<div class="hint good"><b>You found him ✓ +${FIND_PTS} pts.</b>
      ${esc(state.target_bar || "")} is the bar. Keep hitting bars for points.</div>` : "";
  const retry   = failedGuess ? `
      <div class="hint alert">
        <b>That didn't send.</b> ${esc(failedGuess)} may or may not have registered —
        retrying is safe, it can't count twice.
        <div class="row" style="margin-top:12px">
          <button class="btn danger" style="min-height:52px;text-align:center;margin:0"
                  id="retry">Try again</button>
          <button class="btn ghost" style="min-height:52px;text-align:center;margin:0"
                  id="dismiss">Dismiss</button>
        </div>
      </div>` : "";

  h(`
    ${banner}
    <h1 style="${offline ? "margin-top:26px" : ""}">Where are you?</h1>
    <p class="sub">Team ${team} · ${mine.length} of ${BARS.length} tried · 🍌 ×${banLeft}</p>
    ${scoreStrip()}
    ${note}${foundBox}${hint}${retry}
    ${BARS.map((b, i) => {
      const g = gs.find(x => x.bar === b.n);
      if(g){
        const isTarget = g.correct;
        return `<div class="usedrow">
          <div class="info ${isTarget ? "found" : ""}">
            <div class="name">${esc(b.n)}${isTarget ? " ✓" : ""}</div>
            <div class="addr">${esc(b.a)}${g.photo ? " · 📸 proof in" : ""}</div>
          </div>
          ${myBan.includes(b.n) ? `<span class="placed" title="your banana">🍌</span>`
            : (!isTarget && banLeft > 0) ? `<button class="trap" data-trap="${i}">🍌 trap</button>` : ""}
        </div>`;
      }
      const seen = rivals.includes(b.n);
      return `<button class="btn" data-i="${i}">
        <div class="name">${esc(b.n)}</div>
        <div class="addr">${esc(b.a)}${seen ? " · another team tried this" : ""}</div>
      </button>`;
    }).join("")}
    <p class="foot">Tap the bar you are standing in. Honour system.<br>
      🍌 Trap a bar you've visited — rivals who guess it drink a DOUBLED forfeit.</p>
  `);

  el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    notice = null; pending = BARS[+b.dataset.i]; sheetArmedAt = Date.now(); render();
  });
  el.querySelectorAll("[data-trap]").forEach(b => b.onclick = () => {
    notice = null; bananaPending = BARS[+b.dataset.trap].n; sheetArmedAt = Date.now(); render();
  });
  const r = document.getElementById("retry");
  if(r) r.onclick = () => submitGuess(failedGuess);
  const d = document.getElementById("dismiss");
  if(d) d.onclick = () => { failedGuess = null; render(); };
}

/* Buttons inside sheets arm ARM_MS after the sheet opened, so the second half
   of a double-tap can't land on them. */
function armButton(btn, onclick){
  if(!btn) return;
  const wait = Math.max(0, sheetArmedAt + ARM_MS - Date.now());
  if(wait > 0){
    btn.disabled = true;
    setTimeout(() => { btn.disabled = sending; }, wait);
  }
  btn.onclick = onclick;
}

function attachGuessSheet(){
  const bar = pending;
  el.insertAdjacentHTML("beforeend", `
    <div class="sheet">
      <div class="sheet-inner">
        <h2>You're at ${esc(bar.n)}?</h2>
        <p>${esc(bar.a)} — you only get one shot at each bar.</p>
        <button class="btn primary" style="text-align:center" id="yes"
                ${sending ? "disabled" : ""}>${sending ? "Sending…" : "Yes — submit"}</button>
        <button class="btn ghost" style="text-align:center;margin:0" id="no"
                ${sending ? "disabled" : ""}>Cancel</button>
      </div>
    </div>`);
  armButton(document.getElementById("yes"), () => submitGuess(bar.n));
  document.getElementById("no").onclick = () => { pending = null; render(); };
}

function attachBananaSheet(){
  const bar = bananaPending;
  const left = state && state.bananas_left != null ? state.bananas_left : 3;
  el.insertAdjacentHTML("beforeend", `
    <div class="sheet">
      <div class="sheet-inner">
        <h2>🍌 Trap ${esc(bar)}?</h2>
        <p>Any rival team that guesses it gets a DOUBLED forfeit. They can't see it coming.
           ${left - 1} banana${left - 1 === 1 ? "" : "s"} left after this.</p>
        <button class="btn" style="text-align:center;background:var(--amber);color:#241d00;font-weight:800"
                id="byes">Drop the banana</button>
        <button class="btn ghost" style="text-align:center;margin:0" id="bno">Cancel</button>
      </div>
    </div>`);
  armButton(document.getElementById("byes"), () => dropBanana(bar));
  document.getElementById("bno").onclick = () => { bananaPending = null; render(); };
}

function renderCooldown(left, last){
  const wheelOn = state.wheel !== false;
  const mult    = last.mult || 1;
  const by      = last.by || [];
  const f       = wheelOn ? forfeitFor(team, last.bar) : null;
  const spunKey = "stag_spun_" + team + "_" + last.bar;
  const spun    = isSpun(spunKey);
  const showProof = f && spun && !f.free;
  const ordText = !f  ? "Buy a round before you move on."
                : !spun ? "Spin for the forfeit round."
                : f.free ? "You got away with it. Move on when the timer ends."
                : "Buy the round before you move on.";
  h(`
    <div class="full wrong">
      <div class="inner">
        <p class="huge">NOT HERE</p>
        ${mult > 1 ? `<div class="banbanner">🍌 BANANA'D BY ${by.map(esc).join(" & ") || "A RIVAL"}
            — FORFEIT ${mult === 2 ? "DOUBLED" : "×" + mult}</div>` : ""}
        <p class="order" id="ford">${ordText}</p>
        ${f ? wheelHTML(f, spun, mult) : ""}
        <p class="order" id="fresult" style="min-height:1.2em;margin-top:10px">
          ${spun && f ? forfeitText(f, mult) : ""}</p>
        ${showProof ? (
          last.photo
            ? `<div class="proofok">📸 PROOF IN
                 <img src="${PHOTO_BASE + encodeURIComponent(last.photo)}" alt="proof"></div>`
            : uploading
              ? `<div class="proofok">📸 Uploading…</div>`
              : `<button class="proofbtn" id="proofbtn">📸 UPLOAD PROOF OF THE ROUND</button>
                 <input type="file" accept="image/*" capture="environment" id="prooffile" hidden>`
        ) : ""}
        <p class="timer" id="cdtimer">${mmss(left)}</p>
        <p class="timerlabel">until you can guess again</p>
        <p class="whichbar">Wrong: ${esc(last.bar)}</p>
      </div>
    </div>`);
  if(f && !spun){
    const b = document.getElementById("spinbtn");
    if(b) b.onclick = () => spinWheel(f, spunKey, mult);
  }
  const pb = document.getElementById("proofbtn");
  if(pb){
    const fi = document.getElementById("prooffile");
    pb.onclick = () => fi.click();
    fi.onchange = () => uploadProof(last.bar, fi.files[0]);
  }
}

function renderFound(left){
  h(`
    <div class="full win">
      <div class="inner">
        <p class="huge">YOU<br>FOUND HIM</p>
        <p class="order">+${FIND_PTS} POINTS · The table is reserved — have one here.</p>
        <p class="whichbar">${esc(state.target_bar || "")} · Team ${team}</p>
        <p class="timer" id="cdtimer">${mmss(left)}</p>
        <p class="timerlabel">until you're back hunting for points</p>
      </div>
    </div>`);
}

function renderOver(){
  const sc = state.scores || {};
  const fd = state.found  || {};
  const ranked = TEAMS.slice().sort((a, b) => (sc[b] || 0) - (sc[a] || 0));
  const top = sc[ranked[0]] || 0;
  const tied = ranked.filter(t => (sc[t] || 0) === top);
  const headline = tied.length > 1 ? "DEAD HEAT" : "TEAM " + ranked[0] + " WIN";
  const subline  = tied.length > 1
    ? tied.join(" & ") + " tie on " + top + " pts — settle it at the bar."
    : (sc[ranked[0]] || 0) + " points.";
  h(`
    <div class="full over">
      <div class="inner">
        <p class="huge" style="font-size:clamp(34px,10vw,52px)">${headline}</p>
        <p class="order" style="font-size:clamp(18px,5vw,24px)">${subline}</p>
        <p class="order" style="color:#8ee79f">The bar was ${esc(state.target_bar || "—")}</p>
        <div style="width:100%;max-width:340px;margin-top:20px">
          ${ranked.map((t, i) => `
            <div class="card" style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:800">${i + 1}. ${t}${fd[t] ? " ✓ found him" : ""}</span>
              <span style="font-size:22px;font-weight:800">${sc[t] || 0}</span>
            </div>`).join("")}
        </div>
        <p class="whichbar" style="margin-top:18px">
          Anyone who never found him buys the groom a drink.</p>
      </div>
    </div>`);
}

/* ============================================================== admin === */
async function adminCall(action, value){
  try{
    const r = await rpc("stag_admin", { p_pass: adminPass, p_action: action, p_value: value });
    if(!r.ok){ alert(r.message || "Rejected"); return; }
    admin = r; renderAdmin();
  }catch(e){ alert("Network failed — try again"); }
}

function renderAdmin(){
  if(!admin){
    h(`<h1>Admin</h1><p class="sub">Passphrase</p>
       <input id="p" type="password" autocomplete="off">
       <button class="btn primary" style="text-align:center" id="go">Unlock</button>
       <p class="foot"><a href="#" style="color:var(--dim)">← back to game</a></p>`);
    const go = () => { adminPass = document.getElementById("p").value; adminCall("read"); };
    document.getElementById("go").onclick = go;
    document.getElementById("p").onkeydown = e => { if(e.key === "Enter") go(); };
    return;
  }

  const g = admin.game, sc = admin.scores || {}, fd = admin.found || {};
  const feed  = admin.guesses || [];
  const bans  = admin.bananas || [];
  const early = { "Pivoteka Žižkoff":"closes 22:00", "SMÄD craft beer bar":"closes 00:00" };

  const lockLeft = t => {
    const gs = feed.filter(x => x.team === t);
    if(!gs.length) return 0;
    const last = Math.max(...gs.map(x => new Date(x.at).getTime()));
    const w = admin.unlocks && admin.unlocks[t] ? new Date(admin.unlocks[t]).getTime() : 0;
    if(w > last) return 0;
    return Math.max(0, last + g.cooldown_seconds * 1000 - serverNow());
  };

  const teamCards = TEAMS.map(t => {
    const gs = feed.filter(x => x.team === t);
    const last = gs[0];
    const lock = lockLeft(t);
    const myBans = bans.filter(b => b.team === t);
    const photos = gs.filter(x => x.photo).length;
    const wrongs = gs.filter(x => !x.correct).length;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;font-weight:700">
        <span style="color:${TEAM_COLOR[t]}">${t}${fd[t] ? ' <span style="color:var(--green)">✓ FOUND HIM</span>' : ""}</span>
        <span>${sc[t] || 0} pts</span></div>
      <div style="color:var(--dim);font-size:13px;margin-top:3px">
        ${gs.length}/${BARS.length} bars · 🍌 ${3 - myBans.length} left · 📸 ${photos}/${wrongs}
        · ${lock > 0 ? `locked ${mmss(lock)}` : "free"}
        ${last ? `<br>last: ${esc(last.bar)}${last.correct ? " ✓"
                 : g.wheel_enabled ? " — " + forfeitText(forfeitFor(t, last.bar), last.mult) : ""}` : ""}</div>
    </div>`;
  }).join("");

  h(`
    <h1>Admin</h1>
    <p class="sub">Status: <b>${g.status}</b> ·
      ${TEAMS.map(t => `${t} ${sc[t] || 0}`).join(" · ")}</p>

    ${!g.target_bar ? `<div class="hint alert">
      <b>No target set.</b> Every guess will come back wrong and nobody can bank the ${FIND_PTS} pts.
      Set it below before you send the link out.</div>` : ""}

    <label>Teams</label>
    ${teamCards}

    ${bans.length ? `<div class="card" style="font-size:13px;color:var(--dim)">
       ${bans.map(b => `🍌 ${b.team} trapped ${esc(b.bar)}`).join("<br>")}</div>` : ""}

    <label>Target bar</label>
    <select id="target">
      <option value="">— not set —</option>
      ${BARS.map(b => `<option value="${esc(b.n)}" ${g.target_bar === b.n ? "selected" : ""}>
        ${esc(b.n)}${early[b.n] ? "  ⚠ " + early[b.n] : ""}</option>`).join("")}
    </select>
    ${early[g.target_bar] ? `<p class="warn">⚠ Target ${esc(g.target_bar)} ${early[g.target_bar]}.</p>` : ""}

    <label>Cooldown (minutes)</label>
    <input id="cd" type="number" min="0" max="60" value="${Math.round(g.cooldown_seconds/60)}">

    <label>Hint text</label>
    <input id="hint" value="${esc(g.hint_text || "")}" placeholder="e.g. He's on Bořivojova.">

    <label>Show hint after N wrong guesses (currently ${g.hint_after})</label>
    <input id="hintafter" type="number" min="1" max="11" value="${g.hint_after}">

    <label>Forfeit wheel</label>
    <button class="btn ghost" style="text-align:center" id="wheel">
      ${g.wheel_enabled ? "ON — tap to disable" : "OFF — tap to enable"}
    </button>

    <label>Reveal rivals' bars to everyone</label>
    <button class="btn ghost" style="text-align:center" id="rivals">
      Currently ${g.show_rivals ? "SHOWN — tap to hide" : "hidden — tap to show"}
    </button>

    <label>Unlock a team's cooldown now</label>
    <div class="row" style="margin-bottom:10px">
      ${TEAMS.map(t => `<button class="btn ghost" style="min-height:50px;text-align:center;margin:0"
        data-unlock="${t}">${t}</button>`).join("")}
    </div>

    <label>Change admin passphrase</label>
    <div class="row" style="margin-bottom:10px">
      <input id="newpass" autocomplete="off" placeholder="new passphrase" style="margin:0">
      <button class="btn ghost" style="min-height:50px;text-align:center;margin:0" id="savepass">Save</button>
    </div>

    <label>Danger</label>
    <button class="btn danger" style="text-align:center" id="end">End game &amp; reveal scores</button>
    <button class="btn ghost" style="text-align:center;border-color:var(--red);color:#ff9aa0"
            id="reset">Reset everything</button>

    <label>Live feed</label>
    <div class="feed">
      ${feed.map(x => `<div>
        <span class="t">${new Date(x.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</span>
        <span class="tm">${x.team}</span>
        <span class="${x.correct ? "ok" : ""}" style="flex:1">${esc(x.bar)}${x.correct ? ` ✓ +${FIND_PTS}`
          : (x.mult > 1 ? " 🍌×" + x.mult : "") +
            (g.wheel_enabled ? ` <span style="color:var(--dim)">· ${forfeitText(forfeitFor(x.team, x.bar), x.mult)}</span>` : "")}</span>
        ${x.photo ? `<a href="${PHOTO_BASE + encodeURIComponent(x.photo)}" target="_blank">
           <img src="${PHOTO_BASE + encodeURIComponent(x.photo)}" alt="proof"></a>` : ""}
      </div>`).join("") || '<div style="color:var(--dim)">No guesses yet.</div>'}
    </div>
    <p class="foot"><a href="#" style="color:var(--dim)">← back to game</a></p>
  `);

  document.getElementById("target").onchange = e => adminCall("set_target", e.target.value);
  document.getElementById("cd").onchange = e => {
    const m = parseInt(e.target.value, 10);
    if(Number.isNaN(m) || m < 0){ e.target.value = Math.round(g.cooldown_seconds/60); return; }
    adminCall("set_cooldown", String(m * 60));
  };
  document.getElementById("hint").onchange = e => adminCall("set_hint", e.target.value);
  document.getElementById("hintafter").onchange = e => {
    const n = parseInt(e.target.value, 10);
    if(Number.isNaN(n) || n < 1){ e.target.value = g.hint_after; return; }
    adminCall("set_hint_after", String(n));
  };
  document.getElementById("wheel").onclick  = () => adminCall("set_wheel", g.wheel_enabled ? "false" : "true");
  document.getElementById("rivals").onclick = () => adminCall("set_rivals", g.show_rivals ? "false" : "true");
  el.querySelectorAll("[data-unlock]").forEach(b =>
    b.onclick = () => adminCall("unlock", b.dataset.unlock));
  document.getElementById("savepass").onclick = async () => {
    const v = document.getElementById("newpass").value.trim();
    if(!v) return;
    if(!confirm("Change the admin passphrase to \"" + v + "\"? Don't lose it.")) return;
    try{
      const r = await rpc("stag_admin", { p_pass: adminPass, p_action: "set_pass", p_value: v });
      if(!r.ok){ alert(r.message || "Rejected"); return; }
      adminPass = v; admin = r; renderAdmin();
    }catch(e){ alert("Network failed — try again"); }
  };
  document.getElementById("end").onclick = () => {
    if(confirm("End the game and show final scores on all 15 phones?")) adminCall("end_game");
  };
  document.getElementById("reset").onclick = () => {
    if(confirm("Wipe every guess, banana and photo record, and restart? This cannot be undone.")) adminCall("reset");
  };
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

/* =============================================================== boot === */
team = recall("stag_team");
if(team && !TEAMS.includes(team)) team = null;

render();
refresh();

setInterval(refresh, POLL_MS);

/* Countdown tick: surgical text update only, so it can never interrupt the
   wheel, an upload, or an open sheet. */
let lastLeft = 0;
setInterval(() => {
  if(location.hash === "#admin" || !team || !state || spinning || uploading) return;
  const l = cooldownLeft();
  const t = document.getElementById("cdtimer");
  if(l > 0){
    if(t) t.textContent = mmss(l);
    else if(state.status === "running" && !sending) render();  // e.g. woke from lock
  }else if(lastLeft > 0){
    render();                                                  // cooldown just expired
  }
  lastLeft = l;
}, 500);

document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("online", refresh);
window.addEventListener("hashchange", () => { admin = null; render(); });
</script>
</body>
</html>
