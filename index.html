<style>

    --bg:#0a0a0c; --panel:#141419; --line:#26262e;
    --ink:#f4f4f6; --dim:#8c8c99;
    --red:#e01b24; --green:#1a9e3c; --amber:#c9a227;
    --alpha:#e8b73a; --bravo:#4da3ff; --charlie:#ff7ad9;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;

  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--dim);font-size:14px;margin:0 0 20px}

  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  .row{display:flex;gap:10px}

  .counts{

  .hint{

  .alert{border-color:var(--red)!important;background:rgba(224,27,36,.12)!important;color:#ffb3b8!important}

  .mapwrap{height:300px;border-radius:12px;border:1px solid var(--line);

  .maplegend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--dim);
    margin:-6px 0 12px}
  .maplegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}

  /* bar rows: tappable main area + a maps button that opens the pub's pin */

  .barrow .btn{flex:1;margin:0;display:flex;align-items:center;gap:12px}
  .loc{width:58px;min-height:66px;border-radius:14px;border:1px solid var(--line);

  .loc:active{transform:scale(.95)}
  .thumb{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none}

  /* visited bars: struck-through info + live banana-trap / photo badges */
  .usedrow{display:flex;align-items:center;gap:10px;background:var(--panel);

  .usedrow .placed{font-size:22px}
  /* per-pub proof: thumbnail when uploaded, outlined camera when missing */

    border:1px solid var(--green);overflow:hidden;background:none}
  .proofthumb img{width:100%;height:100%;object-fit:cover;display:block}
  .proofadd{width:48px;height:48px;border-radius:10px;flex:none;font-size:18px;

  .bigshot{width:100%;max-height:46vh;object-fit:contain;border-radius:12px;

  /* full-screen result states */

    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;

  .tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tabs button .dot{color:var(--red);font-size:16px;line-height:0}

  /* wheel segment editor */
  .seg{background:var(--panel);border:1px solid var(--line);border-radius:12px;

  .segmain{display:flex;gap:8px;align-items:center}
  .segopts{display:flex;gap:8px;align-items:center;margin-top:6px}
  .seg input{margin:0;flex:1;padding:12px}
  .seg .wnum{flex:none;width:66px;padding:10px;text-align:center;font-weight:700}
  .seg .lockwrap{flex:none;display:flex;align-items:center;gap:2px;font-size:13px;color:var(--dim)}
  .seg .lockn{width:48px;padding:10px 4px;margin:0;text-align:center;font-weight:700}
  .seg .pct{flex:1;font-size:15px;font-weight:700;color:var(--amber);
    font-variant-numeric:tabular-nums}
  .seg .free{min-width:70px;min-height:44px;border-radius:10px;font-size:12px;
    font-weight:700;letter-spacing:.04em;border:1px solid var(--line);color:var(--dim)}
  .seg .free.on{border-color:var(--green);color:#8ee79f;background:rgba(26,158,60,.14)}

    color:#ff9aa0;font-size:20px;line-height:1}
  .seg .del[disabled]{opacity:.3}
  .wpreview{display:block;margin:2px auto 12px}
  .wnote{font-size:12px;color:var(--dim);margin:0 0 10px}

  input,select,textarea{
    width:100%;padding:14px;background:#0e0e12;color:var(--ink);
    border:1px solid var(--line);border-radius:12px;font:inherit;margin-bottom:10px;
    resize:vertical;
  }
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
    color:var(--dim);margin:16px 0 6px}

  .feed{font-size:14px}
  .feed div{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
  .feed .t{width:52px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
  .feed .tm{width:66px;font-weight:700;flex:none}
  .feed .ok{color:var(--green);font-weight:700}
  .feed img{height:34px;border-radius:6px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;margin-bottom:8px}
  .warn{color:var(--amber);font-size:13px;margin:6px 0 0}
  .spacer{flex:1}
  .foot{color:var(--dim);font-size:12px;text-align:center;padding-top:18px}
</style>

<body>
<div id="app"></div>

<script>
/* ============================================================ config === */
const SUPABASE_URL = "https://yfzbgvqthrgqardavayq.supabase.co";
const SUPABASE_KEY = "sb_publishable_vqCpRtzUzIAruuDcrNyIFw_hZHwZxG6";
const PHOTO_BASE   = SUPABASE_URL + "/storage/v1/object/public/stag-photos/";

const TEAMS = ["ALPHA", "BRAVO", "CHARLIE"];
const TEAM_COLOR = { ALPHA: "var(--alpha)", BRAVO: "var(--bravo)", CHARLIE: "var(--charlie)" };
const FIND_PTS = 5;

/* Staré Město / Josefov, Praha 1 — all within about 800m of each other.
   img: drop photos in the repo's bars/ folder with these names; rows degrade
   gracefully while a photo is missing. lat/lon geocoded from OpenStreetMap. */
const BARS = [
  { n:"U Zlatého tygra",     a:"Husova 17",            img:"bars/zlaty-tygr.jpg",   lat:50.08582, lon:14.41804 },
  { n:"U Tří růží",          a:"Husova 10",            img:"bars/tri-ruze.jpg",     lat:50.08559, lon:14.41832 },
  { n:"U Medvídků",          a:"Na Perštýně 7",        img:"bars/medvidku.jpg",     lat:50.08286, lon:14.41879 },
  { n:"U Vejvodů",           a:"Jilská 4",             img:"bars/vejvodu.jpg",      lat:50.08416, lon:14.41876 },
  { n:"AnonymouS Bar",       a:"Michalská 12",         img:"bars/anonymous.jpg",    lat:50.08535, lon:14.42029 },
  { n:"Black Angel's Bar",  a:"Staroměstské nám. 29", img:"bars/black-angels.jpg", lat:50.08648, lon:14.42019 },
  { n:"U Dvou koček",        a:"Uhelný trh 10",        img:"bars/dvou-kocek.jpg",   lat:50.08351, lon:14.42049 },
  { n:"U Provaznice",        a:"Provaznická 3",        img:"bars/provaznice.jpg",   lat:50.08464, lon:14.42316 },
  { n:"Pivnice Radegast",    a:"Templová 2",           img:"bars/radegast.jpg",     lat:50.08758, lon:14.42591 },
  { n:"Lokál Dlouhá",        a:"Dlouhá 33",            img:"bars/lokal.jpg",        lat:50.09072, lon:14.42591 },
  { n:"Prague Beer Museum",  a:"Dlouhá 46",            img:"bars/beer-museum.jpg",  lat:50.09060, lon:14.42676 },
  { n:"Kolkovna",            a:"V Kolkovně 8",         img:"bars/kolkovna.jpg",     lat:50.08998, lon:14.42119 },
  { n:"James Dean",          a:"V Kolkovně 1",         img:"bars/james-dean.jpg",   lat:50.08949, lon:14.42223 },
  { n:"Pivnice U Pivrnce",   a:"Maiselova 3",          img:"bars/pivrnce.jpg",      lat:50.08836, lon:14.41856 },
  { n:"U Rudolfina",         a:"Křižovnická 10",       img:"bars/rudolfina.jpg",    lat:50.08807, lon:14.41558 },
  { n:"Hemingway Bar",       a:"Karoliny Světlé 26",   img:"bars/hemingway.jpg",    lat:50.08400, lon:14.41427 },
  { n:"Konvikt Pub",         a:"Bartolomějská 11",     img:"bars/konvikt.jpg",      lat:50.08304, lon:14.41747 },
  { n:"Bugsy's Bar",        a:"Pařížská 10",          img:"bars/bugsys.jpg",       lat:50.08880, lon:14.41999 },
];
function mapsUrl(b){
  const addr = b.a.split("·")[0].trim();
  return "https://www.google.com/maps/search/?api=1&query=" +
         encodeURIComponent(b.n + ", " + addr + ", Staré Město, Praha 1");
}

/* ========================================================== live map ==== */
/* Leaflet over CARTO dark tiles. Rebuilt per render (the container is wiped
   by innerHTML); degrades to nothing if the CDN never loaded. */
let mapOpen = false;
const mapInstances = {};

function mountMap(id, routes, opts){
  const box = document.getElementById(id);
  if(!box) return;
  if(typeof L === "undefined"){
    box.innerHTML = '<div style="padding:20px;color:var(--dim);text-align:center">Map unavailable — no signal.</div>';
    return;
  }
  const o = opts || {};
  if(mapInstances[id]){ try{ mapInstances[id].remove(); }catch(e){} }
  const map = L.map(box, { zoomControl: true, attributionControl: true });
  mapInstances[id] = map;
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    subdomains: "abcd", maxZoom: 20,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  }).addTo(map);

  const visited = {};
  routes.forEach(rt => rt.bars.forEach(b => { visited[b] = true; }));

  BARS.forEach(b => {
    if(visited[b.n]) return;
    L.circleMarker([b.lat, b.lon], {
      radius: 5, color: "#8c8c99", weight: 1.5, fillColor: "#8c8c99", fillOpacity: .25,
    }).addTo(map).bindTooltip(b.n);
  });

  routes.forEach(rt => {
    const pts = rt.bars.map(n => BAR_XY[n]).filter(Boolean);
    if(pts.length > 1){
      L.polyline(pts, { color: rt.color, weight: 3, opacity: .75, dashArray: "6 6" }).addTo(map);
    }
    rt.bars.forEach((n, i) => {
      const p = BAR_XY[n]; if(!p) return;
      const found = rt.found === n;
      L.marker(p, { icon: L.divIcon({ className: "", iconSize: [24, 24], iconAnchor: [12, 12],
        html: `<div style="width:24px;height:24px;border-radius:50%;border:2px solid #fff;
                 background:${found ? "#1a9e3c" : rt.color};color:#0a0a0c;text-align:center;
                 font:800 12px/20px -apple-system,sans-serif">${found ? "✓" : i + 1}</div>` }),
      }).addTo(map).bindTooltip(n + (found ? " — found him!" : ""));
    });
  });

  (o.bananas || []).forEach(n => {
    const p = BAR_XY[n]; if(!p) return;
    L.marker(p, { icon: L.divIcon({ className: "", iconSize: [20, 20], iconAnchor: [-2, 22],
      html: '<div style="font-size:17px">🍌</div>' }) }).addTo(map);
  });

  map.fitBounds(L.latLngBounds(BARS.map(b => [b.lat, b.lon])).pad(0.18));
}
const BAR_XY = Object.fromEntries(BARS.map(b => [b.n, [b.lat, b.lon]]));

const POLL_MS = 6000;
const RPC_TIMEOUT_MS = 12000;
const ARM_MS = 400;               // sheet buttons arm after this — stops tap-through

/* ============================================================= state === */
let team        = null;
let state       = null;
let clockSkew   = 0;              // serverNow - deviceNow, ms
let pending     = null;           // bar object awaiting guess confirmation
let bananaPending = null;         // bar name awaiting banana confirmation
let photoSheet  = null;           // bar name whose proof photo is open
let sheetArmedAt = 0;             // when the current sheet was opened
let sending     = false;
let uploading   = false;
let spinning    = false;
let failedGuess = null;
let notice      = null;           // one-off message (e.g. "didn't count")
let offline     = false;
let admin       = null;
let adminPass   = "";
let adminTab    = "game";         // game | teams | wheel | feed
let lastSig     = "";
let refreshId   = 0;              // ignore out-of-order poll responses
const spunMem   = new Set();      // in-memory mirror of the spun flags

const el = document.getElementById("app");
const serverNow = () => Date.now() + clockSkew;

function remember(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function isSpun(k){ return spunMem.has(k) || recall(k) === "1"; }
function markSpun(k){ spunMem.add(k); remember(k, "1"); }

const lastGuess = () => (state && state.my_guesses || []).slice(-1)[0] || null;
const iFound    = () => (state && state.my_guesses || []).some(g => g.correct);

/* =========================================================== network === */
async function rpc(fn, body){
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), RPC_TIMEOUT_MS);
  try{
    const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(body || {}),
      signal: ctl.signal,
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  }finally{
    clearTimeout(t);
  }
}

async function refresh(){
  if(location.hash === "#admin") return adminRefresh();
  if(!team) return;
  const id = ++refreshId;                     // stale responses are discarded
  try{
    const data = await rpc("stag_state", { p_team: team });
    if(id !== refreshId) return;
    state = data; offline = false;
    if(data.wheel_options) setWheelOptions(data.wheel_options);
    if(data.server_now) clockSkew = new Date(data.server_now).getTime() - Date.now();
  }catch(e){
    if(id !== refreshId) return;
    offline = true;
  }
  if(spinning || uploading || pickerOpen) return;   // never interrupt those
  const sig = JSON.stringify([state ? { ...state, server_now: 0 } : null, offline, team]);
  if(sig !== lastSig){ lastSig = sig; render(); }
}

let adminSig = "";
async function adminRefresh(){
  if(!admin) return;
  const ae = document.activeElement;
  if(ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  try{
    const r = await rpc("stag_admin", { p_pass: adminPass, p_action: "read" });
    if(!r.ok) return;
    admin = r;
    // Re-render only when the data changed, so the map keeps its pan/zoom.
    const sig = JSON.stringify({ ...r, server_now: 0 });
    if(sig !== adminSig){ adminSig = sig; renderAdmin(); }
  }catch(e){ /* keep last good feed */ }
}

/* Per-team cooldown remaining, from the admin payload (tick keeps it live). */
function adminLockLeft(t){
  if(!admin) return 0;
  const gs = (admin.guesses || []).filter(x => x.team === t);
  if(!gs.length) return 0;
  const last = Math.max(...gs.map(x => new Date(x.at).getTime()));
  const w = admin.unlocks && admin.unlocks[t] ? new Date(admin.unlocks[t]).getTime() : 0;
  if(w > last) return 0;
  return Math.max(0, last + admin.game.cooldown_seconds * 1000 - serverNow());
}

/* ========================================================== cooldown === */
function cooldownLeft(){
  if(!state || !state.last_guess_at) return 0;
  const ends = new Date(state.last_guess_at).getTime() + state.cooldown_seconds * 1000;
  return Math.max(0, ends - serverNow());
}
function mmss(ms){
  const s = Math.ceil(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2,"0") + ":" + String(s % 60).padStart(2,"0");
}
function buzz(pattern){ try{ navigator.vibrate && navigator.vibrate(pattern); }catch(e){} }

/* While the OS camera/gallery picker is up, a re-render would swap out the
   file input and the chosen photo would never arrive. Freeze repaints until
   the picker resolves (change fires, or we regain focus after a cancel). */
let pickerOpen = false;
function openPicker(fi){ pickerOpen = true; fi.click(); }
window.addEventListener("focus", () => { setTimeout(() => { pickerOpen = false; }, 600); });

/* =========================================================== forfeit ==== */
/* Outcome is a pure hash of team+bar: every phone lands on the same result,
   and a refresh can't reroll it. Banana multiplier comes from the server. */
const DEFAULT_WHEEL = [
  { t: "PINTS OF LAGER" }, { t: "SHOTS" }, { t: "MIXERS" },
  { t: "BARMAN'S CHOICE" }, { t: "FREE PASS", free: true },
];
function drinkLabel(t){
  const words = t.toUpperCase().split(/\s+/);
  if(words.length === 1) return words;
  if(words.length === 2 && (words[0] + words[1]).length <= 10) return [words.join(" ")];
  const mid = Math.ceil(words.length / 2);
  return [words.slice(0, mid).join(" "), words.slice(mid).join(" ")];
}
let DRINKS = [];
function setWheelOptions(opts){ DRINKS = toDrinks(opts); }
function weightOf(o){
  const w = Number(o && o.w);
  return isFinite(w) && w > 0 ? w : 1;
}
/* Normalise a raw option array into drawable segments. */
function toDrinks(opts){
  return (Array.isArray(opts) && opts.length >= 2 ? opts : DEFAULT_WHEEL)
    .map(o => ({ label: drinkLabel(o.t), text: String(o.t).toUpperCase(),
                 free: !!o.free, w: weightOf(o) }));
}
/* The wheel a given guess was judged against — stamped on the row, so a pub's
   wheel can be re-tuned later without rewriting forfeits already dealt. */
function drinksFor(g){
  return (g && Array.isArray(g.rig_opts) && g.rig_opts.length >= 2)
    ? toDrinks(g.rig_opts) : DRINKS;
}
/* Segments are sized by weight, so a 50% slice really is half the wheel.
   Returns each segment's start/mid/end angle in degrees clockwise from top. */
function segGeometry(opts){
  const list  = opts || DRINKS;
  const total = list.reduce((s, d) => s + weightOf(d), 0) || 1;
  let acc = 0;
  return list.map(d => {
    const w = weightOf(d), start = acc / total * 360;
    acc += w;
    const end = acc / total * 360;
    return { start, end, mid: (start + end) / 2, span: end - start, pct: w / total * 100 };
  });
}
setWheelOptions(DEFAULT_WHEEL);
const COUNTS = [1,2,2,3,3,3,4,4,5,5];
let resultHoldUntil = 0;   // keeps a settled result on screen briefly even
                           // when the cooldown has already expired

function forfeitFor(team, bar){
  let x = 2166136261;                    // FNV-1a
  const s = team + "|" + bar;
  for(let i = 0; i < s.length; i++){ x = Math.imul(x ^ s.charCodeAt(i), 16777619) >>> 0; }
  const d      = x % DRINKS.length;
  const count  = COUNTS[Math.floor(x / 13) % COUNTS.length];
  const geo    = segGeometry()[d];
  const room   = Math.max(0, Math.min(18, geo.span / 2 - 3));
  const jitter = room ? (Math.floor(x / 131) % (2 * room * 10)) / 10 - room : 0;
  return { count, drink: DRINKS[d], free: !!DRINKS[d].free,
           rotation: 5 * 360 - geo.mid + jitter };
}
function forfeitText(f, mult){
  if(f.free) return "FREE PASS — NOBODY DRINKS";
  const n = f.count * (mult || 1);
  return (n === 5 ? "ALL 5" : n) + " × " + f.drink.text;
}

/* Forfeit for a specific guess row: the server-stamped outcome is the truth.
   Stored text/free flag win over the current wheel config, so an admin edit
   can never rewrite a forfeit already dealt. cfgMatch=false means the wheel
   has changed since the stamp — skip the animation, show the result plain. */
function forfeitOf(teamName, g){
  if(g.rig_d != null){
    const list = drinksFor(g);
    const cur  = list[g.rig_d];
    const text = (g.rig_t || (cur && cur.text) || "MYSTERY ROUND").toUpperCase();
    const free = g.rig_f != null ? !!g.rig_f : !!(cur && cur.free);
    const cfgMatch = !!cur && (!g.rig_t || cur.text === text);
    let x = 2166136261;
    const s = teamName + "|" + g.bar;
    for(let i = 0; i < s.length; i++){ x = Math.imul(x ^ s.charCodeAt(i), 16777619) >>> 0; }
    // land anywhere inside the segment — narrow slices need a smaller wobble
    const geo  = cfgMatch ? segGeometry(list)[g.rig_d] : { mid: 0, span: 360 };
    const room = Math.max(0, Math.min(18, geo.span / 2 - 3));
    const jitter = room ? (x % (2 * room * 10)) / 10 - room : 0;
    return { count: g.rig_c || 1, drink: { text }, free, cfgMatch, list,
             rotation: 5 * 360 - geo.mid + jitter };
  }
  const f = forfeitFor(teamName, g.bar);
  f.cfgMatch = true; f.list = DRINKS;
  return f;
}

function wheelHTML(f, spun, mult){
  const r = 140;
  const list = (f && f.list) || DRINKS;
  const geo = segGeometry(list);
  const segs = list.map((d, i) => {
    const gm = geo[i];
    const a0 = (gm.start - 90) * Math.PI / 180, a1 = (gm.end - 90) * Math.PI / 180;
    // a slice too thin for two lines gets one; too thin for any gets none
    const lines = gm.span < 28 ? [d.text.split(" ")[0]] : d.label;
    const label = gm.span < 14 ? "" : lines.map((line, j) =>
      `<tspan x="0" dy="${j === 0 ? 0 : 14}">${line}</tspan>`).join("");
    return `<path d="M0 0 L${(Math.cos(a0)*r).toFixed(1)} ${(Math.sin(a0)*r).toFixed(1)}
                     A${r} ${r} 0 ${gm.span > 180 ? 1 : 0} 1
                     ${(Math.cos(a1)*r).toFixed(1)} ${(Math.sin(a1)*r).toFixed(1)} Z"
             fill="${d.free ? "rgba(255,255,255,.55)" : `rgba(255,255,255,${i % 2 ? ".30" : ".16"})`}"
             stroke="rgba(0,0,0,.28)" stroke-width="1"/>
            <text transform="rotate(${gm.mid.toFixed(2)}) translate(0 -${r * 0.60})" text-anchor="middle"
              font-size="13" font-weight="700"
              fill="${d.free ? "var(--red)" : "#fff"}">${label}</text>`;
  }).join("");
  return `
    <svg width="225" height="235" viewBox="-150 -158 300 316" style="display:block;margin:6px auto 0">
      <polygon points="-13,-156 13,-156 0,-132" fill="#fff"/>
      <g id="wheelg" style="${spun ? `transform:rotate(${f.rotation}deg)` : ""}">
        <circle r="${r}" fill="rgba(0,0,0,.25)"/>
        ${segs}
      </g>
      <circle r="36" fill="rgba(0,0,0,.45)"/>
      <text id="fcount" y="13" text-anchor="middle" font-size="38" font-weight="800"
            fill="#fff">${spun ? (f.free ? "0" : f.count * (mult || 1)) : "?"}</text>
    </svg>
    ${spun ? "" : `<button class="btn" id="spinbtn" style="background:#fff;color:var(--red);
       text-align:center;font-weight:800;min-height:56px;width:230px;margin:12px auto 0">SPIN</button>`}`;
}

function spinWheel(f, key, mult){
  if(spinning) return;
  spinning = true;
  const gEl = document.getElementById("wheelg");
  const btn = document.getElementById("spinbtn");
  if(btn) btn.style.visibility = "hidden";
  const cnt  = document.getElementById("fcount");
  const roll = setInterval(() => { if(cnt) cnt.textContent = 1 + Math.floor(Math.random() * 5); }, 90);
  gEl.style.transition = "transform 3.2s cubic-bezier(.12,.65,.08,1)";
  requestAnimationFrame(() => { gEl.style.transform = `rotate(${f.rotation}deg)`; });
  setTimeout(() => {
    clearInterval(roll);
    markSpun(key);
    spinning = false;
    resultHoldUntil = Date.now() + 4000;   // let them read it before any screen change
    buzz([80, 40, 80, 40, 200]);
    render();                              // full redraw shows result + proof button
  }, 3350);
}

/* ============================================================ actions === */
function applyLocalGuess(bar, r){
  // The guess landed but the follow-up state read didn't: synthesize just
  // enough state locally so the screen moves. Next good poll replaces it.
  // Replays keep their ORIGINAL timestamp so a retry can't restart the
  // cooldown on screen, and never append a duplicate row.
  if(!state) return;
  const at = (r.replay && r.at) ? r.at : r.server_now;
  if(!(state.my_guesses || []).some(g => g.bar === bar)){
    state.my_guesses = (state.my_guesses || []).concat([{
      bar, correct: r.result === "correct", at,
      mult: r.mult || 1, by: r.by || null, photo: null,
      rig_d: r.rig_d != null ? r.rig_d : null, rig_c: r.rig_c != null ? r.rig_c : null,
      rig_t: r.rig_t || null, rig_f: !!r.rig_f,
    }]);
  }
  state.last_guess_at = at;
  if(r.cooldown_seconds != null) state.cooldown_seconds = r.cooldown_seconds;
  state.proof_due = (r.result === "wrong" && state.wheel !== false &&
                     r.rig_d != null && !r.rig_f) ? bar : null;
}

async function submitGuess(bar){
  if(sending) return;
  sending = true; failedGuess = null; notice = null; render();   // sheet shows "Sending…"
  try{
    const r = await rpc("stag_guess", { p_team: team, p_bar: bar });
    pending = null;
    if(r.server_now) clockSkew = new Date(r.server_now).getTime() - Date.now();
    if(r.result === "correct")      buzz([120, 60, 120, 60, 400]);
    else if(r.result === "wrong")   buzz(500);
    else if(r.result === "locked")  notice = "That didn't count — your team was already on cooldown. " + bar + " is still available.";
    else if(r.result === "need_proof") notice = "That didn't count — upload the proof photo of the round at " + (r.bar || "the last bar") + " first. " + bar + " is still available.";
    else if(r.result === "error")   notice = r.message || "Rejected.";
    await refresh();
    if(offline && (r.result === "wrong" || r.result === "correct")) applyLocalGuess(bar, r);
  }catch(e){
    failedGuess = bar;                      // timeout or dead network: offer retry
  }finally{
    pending = null; sending = false; render();
  }
}

async function dropBanana(bar){
  bananaPending = null; render();
  try{
    const r = await rpc("stag_banana", { p_team: team, p_bar: bar });
    if(r.result === "error") notice = r.message;
    await refresh(); render();
  }catch(e){
    notice = "Banana didn't send — try again."; render();
  }
}

async function uploadProof(bar, file){
  if(uploading || !file) return;
  uploading = true; render();
  try{
    const blob = await compressImage(file);
    const path = team + "-" + Date.now() + ".jpg";
    const res = await fetch(SUPABASE_URL + "/storage/v1/object/stag-photos/" + path, {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY,
                 "Content-Type": "image/jpeg" },
      body: blob,
    });
    if(!res.ok) throw new Error("upload " + res.status);
    const r = await rpc("stag_photo", { p_team: team, p_bar: bar, p_path: path });
    if(r.result !== "ok") throw new Error(r.message || "rejected");
    uploading = false;
    await refresh(); render();
  }catch(e){
    uploading = false;
    notice = "Photo didn't upload — try again when you have signal.";
    render();
  }
}

function compressImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? resolve(b) : reject(new Error("encode failed")), "image/jpeg", 0.65);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("read failed")); };
    img.src = url;
  });
}

/* ============================================================== views === */
function h(html){ el.innerHTML = html; }

function render(){
  if(location.hash === "#admin") return renderAdmin();
  if(!team) return renderJoin();
  if(!state){ renderConnecting(); }
  else if(state.status !== "running"){ renderOver(); }
  else{
    const left = cooldownLeft();
    const last = lastGuess();
    // A wrong guess holds the red screen until BOTH the timer runs out AND
    // the forfeit's photo proof is in (server-enforced via proof_due).
    if(last && last.correct && left > 0)  renderFound(left);
    else if(last && !last.correct &&
            (left > 0 || state.proof_due === last.bar || Date.now() < resultHoldUntil))
                                          renderCooldown(left, last);
    else                                  renderGuessList();
  }
  // Sheets are drawn BY render, so a re-render can never orphan them.
  if(pending)       attachGuessSheet();
  if(bananaPending) attachBananaSheet();
  if(photoSheet)    attachPhotoSheet();
}

function renderConnecting(){
  h(`
    <h1>Find the Groom</h1>
    <p class="sub">Team ${team}</p>
    ${offline
      ? `<div class="hint alert">
           <b>Can't reach the server.</b> Walk towards the door or the street —
           cellar bars kill the signal. Retrying automatically.
         </div>
         <button class="btn primary" style="text-align:center" id="again">Retry now</button>`
      : `<p class="sub">Connecting…</p>`}
    <div class="spacer"></div>
    <button class="btn ghost" style="text-align:center" id="switch">Change team</button>
  `);
  const a = document.getElementById("again");
  if(a) a.onclick = refresh;
  document.getElementById("switch").onclick = () => {
    team = null; remember("stag_team", ""); render();
  };
}

function renderJoin(){
  h(`
    <h1>Find the Groom</h1>
    <p class="sub">Old Town · Friday night. Pick your team.</p>
    ${TEAMS.map(t => `<button class="btn big" data-team="${t}">${t}</button>`).join("")}
    <div class="spacer"></div>
    <p class="foot">One bar has a table reserved. Finding it = ${FIND_PTS} pts.
      Every other bar you drink at = 1 pt (2 if banana'd). Most points wins.</p>
  `);
  el.querySelectorAll("[data-team]").forEach(b => b.onclick = () => {
    team = b.dataset.team; remember("stag_team", team);
    render(); refresh();
  });
}

function scoreStrip(){
  const sc = (state && state.scores) || {};
  const fd = (state && state.found)  || {};
  return `<div class="counts">${TEAMS.map(t =>
    `<div class="${t === team ? "me" : ""}">${t}${fd[t] ? " ✓" : ""}<b>${sc[t] || 0}</b></div>`
  ).join("")}</div>`;
}

function renderGuessList(){
  const gs      = state.my_guesses || [];
  const mine    = gs.map(g => g.bar);
  const rivals  = state.rival_bars || [];
  const myBan   = state.my_bananas || [];
  const banLeft = state.bananas_left != null ? state.bananas_left : 3;
  const found   = iFound();
  const banner  = offline ? `<div class="banner">No signal — showing last known state</div>` : "";
  const note    = notice ? `<div class="hint">${esc(notice)}</div>` : "";
  const hint    = state.hint ? `<div class="hint"><b>Hint.</b> ${esc(state.hint)}</div>` : "";
  const foundBox = found ? `<div class="hint good"><b>You found him ✓ +${FIND_PTS} pts.</b>
      ${esc(state.target_bar || "")} is the bar. Keep hitting bars for points.</div>` : "";
  const retry   = failedGuess ? `
      <div class="hint alert">
        <b>That didn't send.</b> ${esc(failedGuess)} may or may not have registered —
        retrying is safe, it can't count twice.
        <div class="row" style="margin-top:12px">
          <button class="btn danger" style="min-height:52px;text-align:center;margin:0"
                  id="retry">Try again</button>
          <button class="btn ghost" style="min-height:52px;text-align:center;margin:0"
                  id="dismiss">Dismiss</button>
        </div>
      </div>` : "";

  h(`
    ${banner}
    <h1 style="${offline ? "margin-top:26px" : ""}">Where are you?</h1>
    <p class="sub">Team ${team} · ${mine.length} of ${BARS.length} tried · 🍌 ×${banLeft}</p>
    ${scoreStrip()}
    <button class="btn ghost" id="maptoggle"
            style="min-height:48px;text-align:center;margin-bottom:10px">
      ${mapOpen ? "Hide map" : "🗺 Show map"}</button>
    ${mapOpen ? '<div id="pmap" class="mapwrap"></div>' : ""}
    ${note}${foundBox}${hint}${retry}
    ${BARS.map((b, i) => {
      const g = gs.find(x => x.bar === b.n);
      if(g){
        const isTarget = g.correct;
        const wf = (!isTarget && state.wheel !== false && g.rig_d != null)
                   ? forfeitOf(team, g) : null;
        const owed = wf && !wf.free;
        return `<div class="usedrow">
          ${b.img ? `<img class="thumb" src="${b.img}" alt="" loading="lazy"
             style="opacity:${isTarget ? 1 : .38}" onerror="this.remove()">` : ""}
          <div class="info ${isTarget ? "found" : ""}">
            <div class="name">${esc(b.n)}${isTarget ? " ✓" : ""}</div>
            <div class="addr">${wf ? esc(forfeitText(wf, g.mult || 1)) : esc(b.a)}</div>
          </div>
          ${owed || g.photo ? (g.photo
              ? `<button class="proofthumb" data-photo="${i}" title="view / replace photo">
                   <img src="${PHOTO_BASE + encodeURIComponent(g.photo)}" alt="proof"></button>`
              : `<button class="proofadd" data-photo="${i}" title="add photo">📷</button>`)
            : ""}
          ${myBan.includes(b.n) ? `<span class="placed" title="your banana">🍌</span>`
            : (!isTarget && banLeft > 0) ? `<button class="trap" data-trap="${i}">🍌</button>` : ""}
        </div>`;
      }
      const seen = rivals.includes(b.n);
      return `<div class="barrow">
        <button class="btn" data-i="${i}">
          ${b.img ? `<img class="thumb" src="${b.img}" alt="" loading="lazy"
             onerror="this.remove()">` : ""}
          <div>
            <div class="name">${esc(b.n)}</div>
            <div class="addr">${esc(b.a)}${seen ? " · another team tried this" : ""}</div>
          </div>
        </button>
        <a class="loc" href="${mapsUrl(b)}" target="_blank" rel="noopener"
           aria-label="open in maps">📍</a>
      </div>`;
    }).join("")}
    <p class="foot">Tap the bar you are standing in. Honour system.<br>
      🍌 Trap a bar you've visited — rivals who guess it drink a DOUBLED forfeit.</p>
  `);

  document.getElementById("maptoggle").onclick = () => { mapOpen = !mapOpen; render(); };
  if(mapOpen){
    const foundBar = (gs.find(x => x.correct) || {}).bar;
    mountMap("pmap", [{ team, color: TEAM_COLOR[team], bars: mine, found: foundBar }],
             { bananas: myBan });
  }
  el.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
    notice = null; pending = BARS[+b.dataset.i]; sheetArmedAt = Date.now(); render();
  });
  el.querySelectorAll("[data-trap]").forEach(b => b.onclick = () => {
    notice = null; bananaPending = BARS[+b.dataset.trap].n; sheetArmedAt = Date.now(); render();
  });
  el.querySelectorAll("[data-photo]").forEach(b => b.onclick = () => {
    notice = null; photoSheet = BARS[+b.dataset.photo].n; render();
  });
  const r = document.getElementById("retry");
  if(r) r.onclick = () => submitGuess(failedGuess);
  const d = document.getElementById("dismiss");
  if(d) d.onclick = () => { failedGuess = null; render(); };
}

/* Buttons inside sheets arm ARM_MS after the sheet opened, so the second half
   of a double-tap can't land on them. */
function armButton(btn, onclick){
  if(!btn) return;
  const wait = Math.max(0, sheetArmedAt + ARM_MS - Date.now());
  if(wait > 0){
    btn.disabled = true;
    setTimeout(() => { btn.disabled = sending; }, wait);
  }
  btn.onclick = onclick;
}

function attachGuessSheet(){
  const bar = pending;
  el.insertAdjacentHTML("beforeend", `
    <div class="sheet">
      <div class="sheet-inner">
        <h2>You're at ${esc(bar.n)}?</h2>
        <p>${esc(bar.a)} — you only get one shot at each bar.</p>
        <button class="btn primary" style="text-align:center" id="yes"
                ${sending ? "disabled" : ""}>${sending ? "Sending…" : "Yes — submit"}</button>
        <button class="btn ghost" style="text-align:center;margin:0" id="no"
                ${sending ? "disabled" : ""}>Cancel</button>
      </div>
    </div>`);
  armButton(document.getElementById("yes"), () => submitGuess(bar.n));
  document.getElementById("no").onclick = () => { pending = null; render(); };
}

/* View / replace the proof photo for any pub the team has already drunk at. */
function attachPhotoSheet(){
  const bar = photoSheet;
  const g   = (state.my_guesses || []).find(x => x.bar === bar);
  if(!g){ photoSheet = null; return; }
  const wf   = (!g.correct && state.wheel !== false && g.rig_d != null)
               ? forfeitOf(team, g) : null;
  const has  = !!g.photo;
  el.insertAdjacentHTML("beforeend", `
    <div class="sheet">
      <div class="sheet-inner">
        <h2>${esc(bar)}</h2>
        <p>${wf ? "Forfeit dealt here: <b style='color:#f0d98a'>" +
                  esc(forfeitText(wf, g.mult || 1)) + "</b>" +
                  (g.mult > 1 ? " 🍌" : "")
                : "No forfeit owed here."}</p>
        ${has
          ? `<img class="bigshot" src="${PHOTO_BASE + encodeURIComponent(g.photo)}" alt="proof">`
          : `<div class="hint alert" style="margin-bottom:14px"><b>No photo yet.</b>
               ${wf && !wf.free ? "This round still owes proof." : "You can still add one."}</div>`}
        ${uploading
          ? `<button class="btn" style="text-align:center" disabled>Uploading…</button>`
          : `<div class="row" style="margin-bottom:10px">
               <button class="btn primary" style="min-height:54px;text-align:center;margin:0"
                       id="pscam">📸 ${has ? "Retake" : "Take photo"}</button>
               <button class="btn ghost" style="min-height:54px;text-align:center;margin:0"
                       id="pslib">🖼️ Library</button>
             </div>
             <input type="file" accept="image/*" capture="environment" id="psfilecam" hidden>
             <input type="file" accept="image/*" id="psfilelib" hidden>`}
        <button class="btn ghost" style="text-align:center;margin:0" id="psclose">Close</button>
      </div>
    </div>`);
  [["pscam", "psfilecam"], ["pslib", "psfilelib"]].forEach(([bid, fid]) => {
    const btn = document.getElementById(bid), fi = document.getElementById(fid);
    if(!btn || !fi) return;
    btn.onclick = () => openPicker(fi);
    fi.onchange = () => { pickerOpen = false;
                          if(fi.files && fi.files[0]) uploadProof(bar, fi.files[0]); };
  });
  document.getElementById("psclose").onclick = () => { photoSheet = null; render(); };
}

function attachBananaSheet(){
  const bar = bananaPending;
  const left = state && state.bananas_left != null ? state.bananas_left : 3;
  el.insertAdjacentHTML("beforeend", `
    <div class="sheet">
      <div class="sheet-inner">
        <h2>🍌 Trap ${esc(bar)}?</h2>
        <p>Any rival team that guesses it gets a DOUBLED forfeit. They can't see it coming.
           ${left - 1} banana${left - 1 === 1 ? "" : "s"} left after this.</p>
        <button class="btn" style="text-align:center;background:var(--amber);color:#241d00;font-weight:800"
                id="byes">Drop the banana</button>
        <button class="btn ghost" style="text-align:center;margin:0" id="bno">Cancel</button>
      </div>
    </div>`);
  armButton(document.getElementById("byes"), () => dropBanana(bar));
  document.getElementById("bno").onclick = () => { bananaPending = null; render(); };
}

function renderCooldown(left, last){
  const wheelOn = state.wheel !== false;
  const mult    = last.mult || 1;
  const by      = last.by || [];
  const f       = wheelOn ? forfeitOf(team, last) : null;
  // Keyed by the guess timestamp too, so an admin reset + re-guess of the
  // same bar gets a fresh spin instead of a stale settled wheel.
  const spunKey = "stag_spun_" + team + "_" + last.bar + "_" + (last.at || "");
  // A wheel edited since this outcome was stamped can't animate to it — show
  // the result plainly instead of landing on a mislabeled segment.
  const spun    = isSpun(spunKey) || (f && f.cfgMatch === false);
  const showProof = f && spun && !f.free;
  const proofDue  = state.proof_due === last.bar && !last.photo;
  const ordText = !f  ? "Buy a round before you move on."
                : !spun ? "Spin for the forfeit round."
                : f.free ? "You got away with it. Move on when the timer ends."
                : "Buy the round and snap the proof.";
  h(`
    <div class="full wrong">
      <div class="inner">
        <p class="huge">NOT HERE</p>
        ${mult > 1 ? `<div class="banbanner">🍌 BANANA'D BY ${by.map(esc).join(" & ") || "A RIVAL"}
            — FORFEIT ${mult === 2 ? "DOUBLED" : "×" + mult}</div>` : ""}
        <p class="order" id="ford">${ordText}</p>
        ${f && f.cfgMatch !== false ? wheelHTML(f, spun, mult) : ""}
        <p class="order" id="fresult" style="min-height:1.2em;margin-top:10px">
          ${spun && f ? forfeitText(f, mult) : ""}</p>
        ${showProof ? (
          last.photo
            ? `<div class="proofok">📸 PROOF IN
                 <img src="${PHOTO_BASE + encodeURIComponent(last.photo)}" alt="proof"></div>`
            : uploading
              ? `<div class="proofok">📸 Uploading…</div>`
              : `<div class="proofrow">
                   <button class="proofbtn" id="proofcam">📸 TAKE PHOTO</button>
                   <button class="proofbtn alt" id="prooflib">🖼️ FROM LIBRARY</button>
                 </div>
                 <input type="file" accept="image/*" capture="environment" id="prooffilecam" hidden>
                 <input type="file" accept="image/*" id="prooffilelib" hidden>`
        ) : ""}
        ${left > 0
          ? `<p class="timer" id="cdtimer">${mmss(left)}</p>
             <p class="timerlabel">${proofDue
                ? "then upload the proof to move on"
                : "until you can guess again"}</p>`
          : `<p class="timer" style="font-size:clamp(30px,9vw,44px)">📸 PROOF NEEDED</p>
             <p class="timerlabel">${spun
                ? "upload the photo to unlock the next pub"
                : "spin, drink, then upload the photo to unlock the next pub"}</p>`}
        <p class="whichbar">Wrong: ${esc(last.bar)}</p>
      </div>
    </div>`);
  if(f && !spun){
    const b = document.getElementById("spinbtn");
    if(b) b.onclick = () => spinWheel(f, spunKey, mult);
  }
  [["proofcam", "prooffilecam"], ["prooflib", "prooffilelib"]].forEach(([bid, fid]) => {
    const btn = document.getElementById(bid), fi = document.getElementById(fid);
    if(!btn || !fi) return;
    btn.onclick  = () => openPicker(fi);
    fi.onchange  = () => { pickerOpen = false;
                           if(fi.files && fi.files[0]) uploadProof(last.bar, fi.files[0]); };
  });
}

function renderFound(left){

    <div class="full win">

        <p class="huge">YOU<br>FOUND HIM</p>
        <p class="order">+${FIND_PTS} POINTS · The table is reserved — have one here.</p>
        <p class="whichbar">${esc(state.target_bar || "")} · Team ${team}</p>

function renderOver(){

/* ==================================================== wheel editor ====== */
/* Draft lives outside the render so the 6s admin poll can't wipe a
   half-composed wheel. null = in sync with the server. */
let wheelDraft = null;
let wheelScope = "";      // "" = default wheel, otherwise a pub name

const afterOf = o => {
  const n = parseInt(o && o.after, 10);
  return isFinite(n) && n > 0 ? Math.min(30, n) : 0;
};
const cleanOpts = o => (o || []).map(x => ({ t: x.t || "", free: !!x.free,
                                             w: weightOf(x), after: afterOf(x) }));
const sameOpts  = (a, b) => JSON.stringify(cleanOpts(a)) === JSON.stringify(cleanOpts(b));

function wheelPreviewHTML(opts){
  const r = 60, geo = segGeometry(opts);
  const arc = opts.map((o, i) => {
    const gm = geo[i];
    const a0 = (gm.start - 90) * Math.PI / 180, a1 = (gm.end - 90) * Math.PI / 180;
    return `<path d="M0 0 L${(Math.cos(a0)*r).toFixed(1)} ${(Math.sin(a0)*r).toFixed(1)}
              A${r} ${r} 0 ${gm.span > 180 ? 1 : 0} 1
              ${(Math.cos(a1)*r).toFixed(1)} ${(Math.sin(a1)*r).toFixed(1)} Z"
            fill="${o.free ? "rgba(26,158,60,.5)"
                           : `rgba(255,255,255,${i % 2 ? ".24" : ".13"})`}"
            stroke="#0a0a0c" stroke-width=".7"/>`;
  }).join("");
  const labels = opts.map((o, i) => {
    const gm = geo[i];
    if(gm.span < 12) return "";
    const txt = (afterOf(o) ? "🔒" : "") + (o.t || "?").toUpperCase();
    return `<text transform="rotate(${gm.mid.toFixed(2)}) translate(0 -${r * 0.60})"
              text-anchor="middle" font-size="6.5" font-weight="700"
              opacity="${afterOf(o) ? ".55" : "1"}"
              fill="${o.free ? "#8ee79f" : "#fff"}">${esc(txt.slice(0, 13))}</text>`;
  }).join("");
  return `<svg id="wpreview" class="wpreview" width="160" height="160" viewBox="-70 -70 140 140">
    <polygon points="-6,-68 6,-68 0,-56" fill="var(--amber)"/>
    ${arc}${labels}<circle r="15" fill="#0a0a0c"/>
  </svg>`;
}

/* Which wheel the editor is pointed at: "" = the game-wide default, or a pub
   name for that pub's override. */
function scopeBase(g){
  if(!wheelScope) return g.wheel_options;
  const pw = (admin && admin.pub_wheels) || {};
  return pw[wheelScope] || g.wheel_options;      // seed a new override from the default
}
function scopeHasOverride(){
  const pw = (admin && admin.pub_wheels) || {};
  return !!(wheelScope && pw[wheelScope]);
}

function wheelScopeHTML(g){
  const pw = (admin && admin.pub_wheels) || {};
  const n = Object.keys(pw).length;
  return `
    <select id="wscope">
      <option value="" ${wheelScope === "" ? "selected" : ""}>Default wheel — every pub</option>
      ${BARS.map(b => `<option value="${esc(b.n)}" ${wheelScope === b.n ? "selected" : ""}>
        ${pw[b.n] ? "★ " : ""}${esc(b.n)}${pw[b.n] ? " (custom)" : ""}</option>`).join("")}
    </select>
    <p class="wnote">${wheelScope
      ? (scopeHasOverride()
          ? "This pub has its own wheel. Teams guessing here spin this one."
          : "Editing a copy of the default — save to give this pub its own wheel.")
      : n
        ? n + " pub" + (n === 1 ? "" : "s") + " override this: " +
          Object.keys(pw).map(esc).join(", ")
        : "Used at every pub. Pick a pub above to tailor one to its menu."}</p>`;
}

function wheelEditorHTML(g){
  const draft = wheelDraft || cleanOpts(scopeBase(g));
  const dirty = !sameOpts(draft, scopeBase(g)) || (wheelScope && !scopeHasOverride());
  const blank = draft.some(o => !o.t.trim());
  const freeN = draft.filter(o => o.free).length;
  const total = draft.reduce((s, o) => s + weightOf(o), 0);
  const pcts  = segGeometry(draft).map(s => s.pct);
  const gated = draft.filter(o => afterOf(o) > 0);
  const openN = draft.length - gated.length;
  return `
    ${wheelPreviewHTML(draft)}
    <p class="wnote">${draft.length} segments · ${freeN} free pass${freeN === 1 ? "" : "es"}
      · shares total ${total}${total === 100 ? " (reads straight as %)" : ""}.
      Free passes owe no photo.</p>
    ${gated.length ? `<p class="wnote" style="color:#f0d98a">🔒 ${gated.map(o =>
        esc(o.t) + " appears after " + o.after + " pub" + (o.after === 1 ? "" : "s")).join(" · ")}.
      Until then the other ${draft.length - gated.length} share the wheel.</p>` : ""}
    ${openN < 2 ? `<p class="warn">⚠ At least 2 segments must be unlocked from the
      first pub — set more 🔒 values to 0.</p>` : ""}
    ${draft.map((o, i) => `
      <div class="seg">
        <div class="segmain">
          <input data-segtext="${i}" value="${esc(o.t)}" maxlength="24"
                 placeholder="segment ${i + 1}" spellcheck="false">
          <button class="del" data-segdel="${i}" ${draft.length <= 2 ? "disabled" : ""}
                  title="remove">×</button>
        </div>
        <div class="segopts">
          <input class="wnum" type="number" min="1" max="1000" step="1"
                 data-segw="${i}" value="${weightOf(o)}">
          <span class="pct" data-segpct="${i}">${pcts[i].toFixed(pcts[i] < 10 ? 1 : 0)}%</span>
          <span class="lockwrap" title="unlocks after this many pubs — 0 = always">🔒
            <input class="lockn" type="number" min="0" max="30" step="1"
                   data-segafter="${i}" value="${afterOf(o)}"></span>
          <button class="free ${o.free ? "on" : ""}" data-segfree="${i}"
                  title="free pass — nobody drinks">FREE</button>
        </div>
      </div>`).join("")}
    <div class="row" style="margin-bottom:10px">
      <button class="btn ghost" style="min-height:50px;text-align:center;margin:0"
              id="segadd" ${draft.length >= 8 ? "disabled" : ""}>+ Add</button>
      <button class="btn ghost" style="min-height:50px;text-align:center;margin:0"
              id="segeven" title="give every segment the same chance">Even odds</button>
      <button class="btn ghost" style="min-height:50px;text-align:center;margin:0"
              id="segrevert" ${dirty ? "" : "disabled"}>Revert</button>
    </div>
    ${scopeHasOverride() ? `<button class="btn ghost" style="text-align:center;
        border-color:var(--red);color:#ff9aa0" id="segdrop">
        Remove override — use the default wheel here</button>` : ""}
    <button class="btn" style="text-align:center;font-weight:700;
      background:${dirty && !blank ? "var(--amber)" : "transparent"};
      color:${dirty && !blank ? "#241d00" : "var(--dim)"};
      border:1px solid ${dirty && !blank ? "var(--amber)" : "var(--line)"}"
      id="savewheel" ${dirty && !blank ? "" : "disabled"}>
      ${blank ? "Every segment needs a name"
              : dirty ? (wheelScope ? "Save wheel for " + esc(wheelScope)
                                    : "Save default wheel — " + draft.length + " segments")
              : "Saved"}</button>`;
}

function syncSaveBtn(draft, g){
  const save = document.getElementById("savewheel");
  if(!save) return;
  const blank = draft.some(o => !o.t.trim());
  const tooLocked = draft.filter(o => !afterOf(o)).length < 2;
  const ok = (!sameOpts(draft, scopeBase(g)) || (wheelScope && !scopeHasOverride()))
             && !blank && !tooLocked;
  save.disabled = !ok;
  save.textContent = tooLocked ? "Need 2 segments unlocked at pub 0"
                   : blank ? "Every segment needs a name"
                   : ok ? (wheelScope ? "Save wheel for " + wheelScope
                                      : "Save default wheel — " + draft.length + " segments")
                   : "Saved";
  save.style.background  = ok ? "var(--amber)" : "transparent";
  save.style.color       = ok ? "#241d00" : "var(--dim)";
  save.style.borderColor = ok ? "var(--amber)" : "var(--line)";
}

function wireWheelEditor(g){
  const draft = wheelDraft || cleanOpts(scopeBase(g));
  const touch = () => { wheelDraft = draft; renderAdmin(); };

  const sc = document.getElementById("wscope");
  if(sc) sc.onchange = e => {
    if(wheelDraft && !sameOpts(wheelDraft, scopeBase(g)) &&
       !confirm("Discard unsaved changes to this wheel?")){ e.target.value = wheelScope; return; }
    wheelScope = e.target.value; wheelDraft = null; renderAdmin();
  };
  const drop = document.getElementById("segdrop");
  if(drop) drop.onclick = () => {
    if(!confirm(wheelScope + " will go back to the default wheel. Remove its override?")) return;
    wheelDraft = null;
    adminCall("clear_pub_wheel", wheelScope);
  };

  el.querySelectorAll("[data-segtext]").forEach(inp => {
    inp.oninput = () => {
      draft[+inp.dataset.segtext].t = inp.value;
      wheelDraft = draft;
      // repaint preview + save button in place — a full re-render would
      // steal focus mid-word
      const pv = document.getElementById("wpreview");
      if(pv) pv.outerHTML = wheelPreviewHTML(draft);
      syncSaveBtn(draft, g);
    };
  });
  // weight edits repaint the preview + percentages in place, keeping focus
  el.querySelectorAll("[data-segw]").forEach(inp => {
    inp.oninput = () => {
      const n = parseInt(inp.value, 10);
      draft[+inp.dataset.segw].w = (isFinite(n) && n > 0) ? Math.min(1000, n) : 1;
      wheelDraft = draft;
      const pv = document.getElementById("wpreview");
      if(pv) pv.outerHTML = wheelPreviewHTML(draft);
      const p = segGeometry(draft).map(s => s.pct);
      el.querySelectorAll("[data-segpct]").forEach(sp => {
        const v = p[+sp.dataset.segpct];
        sp.textContent = v.toFixed(v < 10 ? 1 : 0) + "%";
      });
      const tot = draft.reduce((s, o) => s + weightOf(o), 0);
      const note = document.querySelector(".wnote");
      if(note) note.textContent = draft.length + " segments · " +
        draft.filter(o => o.free).length + " free · shares total " + tot +
        (tot === 100 ? " (reads straight as %)" : "");
      syncSaveBtn(draft, g);
    };
    inp.onblur = () => { wheelDraft = draft; renderAdmin(); };
  });
  el.querySelectorAll("[data-segafter]").forEach(inp => {
    inp.oninput = () => {
      const n = parseInt(inp.value, 10);
      draft[+inp.dataset.segafter].after = (isFinite(n) && n > 0) ? Math.min(30, n) : 0;
      wheelDraft = draft;
      const pv = document.getElementById("wpreview");
      if(pv) pv.outerHTML = wheelPreviewHTML(draft);
      syncSaveBtn(draft, g);
    };
    inp.onblur = () => { wheelDraft = draft; renderAdmin(); };
  });
  const even = document.getElementById("segeven");
  if(even) even.onclick = () => {
    const each = Math.round(100 / draft.length);
    draft.forEach(o => { o.w = each; });
    touch();
  };
  el.querySelectorAll("[data-segfree]").forEach(b => b.onclick = () => {
    const i = +b.dataset.segfree; draft[i].free = !draft[i].free; touch();
  });
  el.querySelectorAll("[data-segdel]").forEach(b => b.onclick = () => {
    draft.splice(+b.dataset.segdel, 1); touch();
  });
  const add = document.getElementById("segadd");
  if(add) add.onclick = () => { draft.push({ t: "", free: false }); touch(); };
  const rev = document.getElementById("segrevert");
  if(rev) rev.onclick = () => { wheelDraft = null; renderAdmin(); };
  const save = document.getElementById("savewheel");
  if(save) save.onclick = () => {
    const opts = draft.map(o => ({ t: o.t.trim(), w: weightOf(o),
                                   ...(o.free ? { free: true } : {}),
                                   ...(afterOf(o) ? { after: afterOf(o) } : {}) }));
    if(opts.length < 2 || opts.length > 8 || opts.some(o => !o.t)) return;
    if(opts.filter(o => !o.after).length < 2){
      alert("At least 2 segments must be available from the first pub — set more 🔒 values to 0.");
      return;
    }
    if(opts.every(o => o.free) &&
       !confirm("Every segment is a free pass — nobody will ever drink. Save anyway?")) return;
    wheelDraft = null;
    if(wheelScope) adminCall("set_pub_wheel", wheelScope + "|" + JSON.stringify(opts));
    else           adminCall("set_wheel_options", JSON.stringify(opts));
  };
}

/* ============================================================== admin === */
async function adminCall(action, value){
  try{
    const r = await rpc("stag_admin", { p_pass: adminPass, p_action: action, p_value: value });
    if(!r.ok){ alert(r.message || "Rejected"); return; }
    admin = r; renderAdmin();
  }catch(e){ alert("Network failed — try again"); }
}

function renderAdmin(){
  if(!admin){
    h(`<h1>Admin</h1><p class="sub">Passphrase</p>
       <input id="p" type="password" autocomplete="off">
       <button class="btn primary" style="text-align:center" id="go">Unlock</button>
       <p class="foot"><a href="#" style="color:var(--dim)">← back to game</a></p>`);
    const go = () => { adminPass = document.getElementById("p").value; adminCall("read"); };
    document.getElementById("go").onclick = go;
    document.getElementById("p").onkeydown = e => { if(e.key === "Enter") go(); };
    return;
  }

  const g = admin.game, sc = admin.scores || {}, fd = admin.found || {};
  const feed  = admin.guesses || [];
  const bans  = admin.bananas || [];
  // Preserve half-composed controls across the background re-render.
  const keep = {};
  const scrollY = window.scrollY;
  ["rigteam", "rigdrink", "rigcount", "newpass", "wscope"].forEach(id => {
    const n = document.getElementById(id);
    if(n) keep[id] = n.value;
  });
  // pubs that need a heads-up before you make one the target
  const early = {
    "Hemingway Bar":    "small, cocktail bar — may need a reservation",
    "Black Angel's Bar":"cellar bar, can be busy/queued",
    "U Zlatého tygra":  "locals' pub, tiny and often full",
  };

  adminSig = JSON.stringify({ ...admin, server_now: 0 });
  if(admin.game.wheel_options) setWheelOptions(admin.game.wheel_options);

  const teamCards = TEAMS.map(t => {
    const gs = feed.filter(x => x.team === t);
    const last = gs[0];
    const lock = adminLockLeft(t);
    const myBans = bans.filter(b => b.team === t);
    const photos = gs.filter(x => x.photo).length;
    const wrongs = gs.filter(x => !x.correct).length;
    const w = admin.unlocks && admin.unlocks[t] ? new Date(admin.unlocks[t]).getTime() : 0;
    const owesProof = !!(last && !last.correct && !last.photo && g.wheel_enabled
                         && last.rig_d != null && !last.rig_f
                         && !(w > new Date(last.at).getTime()));
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;font-weight:700">
        <span style="color:${TEAM_COLOR[t]}">${t}${fd[t] ? ' <span style="color:var(--green)">✓ FOUND HIM</span>' : ""}</span>
        <span>${sc[t] || 0} pts</span></div>
      <div style="color:var(--dim);font-size:13px;margin-top:3px">
        ${gs.length}/${BARS.length} bars · 🍌 ${3 - myBans.length} left · 📸 ${photos}/${wrongs}
        · <span data-lock="${t}" data-owes="${owesProof ? 1 : 0}">${
            lock > 0 ? `locked ${mmss(lock)}` : owesProof ? "⏳ owes proof" : "free"}</span>
        ${last ? `<br>last: ${esc(last.bar)}${last.correct ? " ✓"
                 : g.wheel_enabled ? " — " + forfeitText(forfeitOf(t, last), last.mult) : ""}` : ""}</div>
    </div>`;
  }).join("");

  const TABS = [
    { k: "game",  label: "Game"  },
    { k: "teams", label: "Teams" },
    { k: "wheel", label: "Wheel" },
    { k: "feed",  label: "Feed"  },
  ];
  const needsTarget = !g.target_bar;
  const owedCount = TEAMS.filter(t => {
    const last = feed.filter(x => x.team === t)[0];
    if(!last || last.correct || last.photo || !g.wheel_enabled) return false;
    const w = admin.unlocks && admin.unlocks[t] ? new Date(admin.unlocks[t]).getTime() : 0;
    return last.rig_d != null && !last.rig_f && !(w > new Date(last.at).getTime());
  }).length;

  const P = {};

  P.teams = `
    ${teamCards}

    <label>All routes</label>
    <div id="amap" class="mapwrap"></div>
    <div class="maplegend">${TEAMS.map(t =>
      `<span><i style="background:${TEAM_COLOR[t]}"></i>${t}</span>`).join("")}</div>

    <label>Unlock a team now (clears cooldown &amp; proof gate)</label>
    <div class="row" style="margin-bottom:10px">
      ${TEAMS.map(t => `<button class="btn ghost" style="min-height:50px;text-align:center;margin:0"
        data-unlock="${t}">${t}</button>`).join("")}
    </div>

    <label>🍌 Bananas placed</label>
    ${bans.length ? `<div class="card" style="font-size:13px;color:var(--dim)">
       ${bans.map(b => `🍌 ${b.team} trapped ${esc(b.bar)}`).join("<br>")}</div>`
      : `<p class="wnote">None placed yet.</p>`}`;

  P.game = `
    ${needsTarget ? `<div class="hint alert">
      <b>No target set.</b> Every guess will come back wrong and nobody can bank the ${FIND_PTS} pts.
      Set it below before you send the link out.</div>` : ""}

    <label>Target bar</label>
    <select id="target">
      <option value="">— not set —</option>
      ${BARS.map(b => `<option value="${esc(b.n)}" ${g.target_bar === b.n ? "selected" : ""}>
        ${esc(b.n)}${early[b.n] ? "  ⚠ " + early[b.n] : ""}</option>`).join("")}
    </select>
    ${early[g.target_bar] ? `<p class="warn">⚠ ${esc(g.target_bar)}: ${early[g.target_bar]}.</p>` : ""}

    <label>Cooldown (minutes)</label>
    <input id="cd" type="number" min="0" max="60" value="${Math.round(g.cooldown_seconds/60)}">
    ${g.cooldown_seconds === 0
      ? `<p class="warn">⚠ Cooldown is 0 — teams can guess back to back.</p>` : ""}

    <label>Hint text</label>
    <input id="hint" value="${esc(g.hint_text || "")}" placeholder="e.g. He's on Dlouhá.">

    <label>Show hint after N wrong guesses</label>
    <input id="hintafter" type="number" min="1" max="17" value="${g.hint_after}">

    <label>Reveal rivals' bars to everyone</label>
    <button class="btn ghost" style="text-align:center" id="rivals">
      Currently ${g.show_rivals ? "SHOWN — tap to hide" : "hidden — tap to show"}
    </button>

    <label>Change admin passphrase</label>
    <div class="row" style="margin-bottom:10px">
      <input id="newpass" autocomplete="off" placeholder="new passphrase" style="margin:0">
      <button class="btn ghost" style="min-height:50px;text-align:center;margin:0" id="savepass">Save</button>
    </div>

    <label>Danger</label>
    <button class="btn danger" style="text-align:center" id="end">End game &amp; reveal scores</button>
    <button class="btn ghost" style="text-align:center;border-color:var(--red);color:#ff9aa0"
            id="reset">Reset everything</button>`;

  P.wheel = `
    <label>Forfeit wheel</label>
    <button class="btn ghost" style="text-align:center" id="wheel">
      ${g.wheel_enabled ? "ON — tap to disable" : "OFF — tap to enable"}
    </button>
    ${!g.wheel_enabled ? `<p class="wnote">With the wheel off, wrong guesses cost only time
      and no proof photos are required.</p>` : ""}

    <label>Which wheel</label>
    ${wheelScopeHTML(g)}

    <label>Segments &amp; odds</label>
    ${wheelEditorHTML(g)}

    <label>🎯 Rig a team's next wheel spin</label>
    <div class="row" style="margin-bottom:10px">
      <select id="rigteam" style="margin:0">
        ${TEAMS.map(t => `<option value="${t}">${t}</option>`).join("")}
      </select>
      <select id="rigdrink" style="margin:0">
        ${DRINKS.map((d, i) => `<option value="${i}">${d.text}</option>`).join("")}
      </select>
      <select id="rigcount" style="margin:0">
        ${[1,2,3,4,5].map(n => `<option value="${n}" ${n === 3 ? "selected" : ""}>${n} drink${n > 1 ? "s" : ""}</option>`).join("")}
      </select>
    </div>
    <button class="btn ghost" style="text-align:center;border-color:var(--amber);color:#f0d98a"
            id="rigset">Rig it — fires on their next wrong guess</button>
    ${Object.keys(admin.rigs || {}).length ? `<div class="card" style="font-size:13px">
      ${Object.entries(admin.rigs).map(([t, rg]) => {
        const d = DRINKS[rg.d] || DRINKS[0];
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0">
          <span>🎯 ${t} → ${d.free ? "FREE PASS" : rg.c + " × " + d.text}</span>
          <button class="trap" style="min-width:60px;min-height:36px" data-unrig="${t}">clear</button>
        </div>`;
      }).join("")}</div>` : ""}`;

  P.feed = `
    <div class="feed">
      ${feed.map(x => `<div>
        <span class="t">${new Date(x.at).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}</span>
        <span class="tm">${x.team}</span>
        <span class="${x.correct ? "ok" : ""}" style="flex:1">${esc(x.bar)}${x.correct ? ` ✓ +${FIND_PTS}`
          : (x.mult > 1 ? " 🍌×" + x.mult : "") + (x.rigged ? " 🎯" : "") +
            (g.wheel_enabled ? ` <span style="color:var(--dim)">· ${forfeitText(forfeitOf(x.team, x), x.mult)}</span>` : "")}</span>
        ${x.photo ? `<a href="${PHOTO_BASE + encodeURIComponent(x.photo)}" target="_blank">
           <img src="${PHOTO_BASE + encodeURIComponent(x.photo)}" alt="proof"></a>` : ""}
      </div>`).join("") || '<div style="color:var(--dim)">No guesses yet.</div>'}
    </div>`;

  h(`
    <h1 style="margin-bottom:2px">Admin</h1>
    <p class="sub" style="margin-bottom:2px">${esc(g.status)} ·
      ${TEAMS.map(t => `${t} ${sc[t] || 0}`).join(" · ")}</p>

    <div class="tabs">
      ${TABS.map(t => `<button data-tab="${t.k}" class="${adminTab === t.k ? "on" : ""}">
        ${t.label}${(t.k === "game" && needsTarget) || (t.k === "teams" && owedCount)
          ? ' <span class="dot">●</span>' : ""}</button>`).join("")}
    </div>

    ${P[adminTab] || P.game}
    <p class="foot"><a href="#" style="color:var(--dim)">← back to game</a></p>
  `);

  el.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
    adminTab = b.dataset.tab; wheelDraft = wheelDraft; window.scrollTo(0, 0); renderAdmin();
  });

  Object.entries(keep).forEach(([id, v]) => {
    const n = document.getElementById(id);
    if(n && v) n.value = v;
  });
  if(scrollY) window.scrollTo(0, scrollY);   // editing controls sit far down the page

  /* Only the active tab's controls exist, so every lookup is optional. */
  const on = (id, ev, fn) => { const n = document.getElementById(id); if(n) n[ev] = fn; };

  if(document.getElementById("amap")){
    mountMap("amap", TEAMS.map(t => ({
      team: t, color: TEAM_COLOR[t],
      bars: feed.filter(x => x.team === t).slice().reverse().map(x => x.bar),
      found: (feed.find(x => x.team === t && x.correct) || {}).bar,
    })), { bananas: bans.map(b => b.bar) });
  }

  on("target", "onchange", e => adminCall("set_target", e.target.value));
  on("cd", "onchange", e => {
    const m = parseInt(e.target.value, 10);
    if(Number.isNaN(m) || m < 0){ e.target.value = Math.round(g.cooldown_seconds/60); return; }
    adminCall("set_cooldown", String(m * 60));
  });
  on("hint", "onchange", e => adminCall("set_hint", e.target.value));
  on("hintafter", "onchange", e => {
    const n = parseInt(e.target.value, 10);
    if(Number.isNaN(n) || n < 1){ e.target.value = g.hint_after; return; }
    adminCall("set_hint_after", String(n));
  });
  on("wheel", "onclick", () => adminCall("set_wheel", g.wheel_enabled ? "false" : "true"));
  if(adminTab === "wheel") wireWheelEditor(g);
  on("rivals", "onclick", () => adminCall("set_rivals", g.show_rivals ? "false" : "true"));
  el.querySelectorAll("[data-unlock]").forEach(b =>
    b.onclick = () => adminCall("unlock", b.dataset.unlock));
  on("rigset", "onclick", () => {
    const t = document.getElementById("rigteam").value;
    const d = document.getElementById("rigdrink").value;
    const c = document.getElementById("rigcount").value;
    adminCall("set_rig", t + "|" + d + "|" + c);
  });
  el.querySelectorAll("[data-unrig]").forEach(b =>
    b.onclick = () => adminCall("clear_rig", b.dataset.unrig));
  on("savepass", "onclick", async () => {
    const v = document.getElementById("newpass").value.trim();
    if(!v) return;
    if(v.length < 6 &&
       !confirm("\"" + v + "\" is short — anyone with the game link can try to guess it. Use it anyway?")) return;
    if(!confirm("Change the admin passphrase to \"" + v + "\"? Don't lose it.")) return;
    try{
      const r = await rpc("stag_admin", { p_pass: adminPass, p_action: "set_pass", p_value: v });
      if(!r.ok){ alert(r.message || "Rejected"); return; }
      adminPass = v; admin = r; renderAdmin();
    }catch(e){ alert("Network failed — try again"); }
  });
  on("end", "onclick", () => {
    if(confirm("End the game and show final scores on all 15 phones?")) adminCall("end_game");
  });
  on("reset", "onclick", () => {
    if(confirm("Wipe every guess, banana and photo record, and restart? This cannot be undone.")) adminCall("reset");
  });
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}

/* =============================================================== boot === */
team = recall("stag_team");
if(team && !TEAMS.includes(team)) team = null;

render();
refresh();

setInterval(refresh, POLL_MS);

/* Countdown tick: surgical text update only, so it can never interrupt the
   wheel, an upload, or an open sheet. */
let lastLeft = 0;
setInterval(() => {
  if(location.hash === "#admin"){
    // keep the team cards' lock countdowns moving without a full re-render
    if(admin) el.querySelectorAll("[data-lock]").forEach(s => {
      const ms = adminLockLeft(s.dataset.lock);
      s.textContent = ms > 0 ? "locked " + mmss(ms)
                    : s.dataset.owes === "1" ? "⏳ owes proof" : "free";
    });
    return;
  }
  if(!team || !state || spinning || uploading) return;
  const l = cooldownLeft();
  const t = document.getElementById("cdtimer");
  if(l > 0){
    if(t) t.textContent = mmss(l);
    else if(state.status === "running" && !sending) render();  // e.g. woke from lock
  }else if(lastLeft > 0){
    render();                                                  // cooldown just expired
  }else if(resultHoldUntil && Date.now() >= resultHoldUntil){
    resultHoldUntil = 0; render();                             // read-the-result hold over
  }
  lastLeft = l;
}, 500);

document.addEventListener("visibilitychange", () => { if(!document.hidden) refresh(); });
window.addEventListener("online", refresh);
window.addEventListener("hashchange", () => { admin = null; render(); });
</script>
</body>
</html>
